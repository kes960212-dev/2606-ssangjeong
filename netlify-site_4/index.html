/* 단순 표(제목 + 머리글 + 내용) 한 장 만들기 */
function simpleSheet(o){
  var head=o.head||[], grid=[], merges=[], heights={};
  if (o.title){
    grid.push([{ v:o.title, s:1 }]); heights[0]=26;
    merges.push('A1:'+colName(Math.max(head.length,1)-1)+'1');
    grid.push([]);
  }
  grid.push(head.map(function(h){ return { v:h, s:7 }; }));
  (o.rows||[]).forEach(function(line){
    var row=head.map(function(_,i){
      var v=line[i]==null?'':line[i];
      return isNum(v) ? { v:v, s:5 } : { v:v, s:3 };
    });
    grid.push(row);
  });
  return { name:o.name, widths:o.widths, grid:grid, merges:merges, heights:heights,
           freeze:'A'+(grid.length-(o.rows||[]).length+1-1+1) };
}
function saveXlsx(sheets, filename){
  var bytes = makeXlsx(sheets);
  var blob = new Blob([bytes], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ───── 학습준비물 신청 서식 (학교 양식 그대로) ───── */
/* 내용 | 규격 | 수량 | 예상단가 | 예상금액 | 관련교과 | 제공단위(학년·학급/모둠·짝/개인) | 비고 */
function prepFormSheet(sheetName, title, rows, minRows){
  var W=[32.8, 13.2, 7, 11.1, 11.2, 9.5, 8.9, 7.4, 6.1, 46.8];
  var grid=[], merges=[], heights={};
  var n=Math.max(rows.length, minRows||20);
  var first=5, last=first+n-1;

  // 1~2행: 제목 + 계
  grid.push([{ v:title, s:1 },null,null,null,null,null,null,null,null,{ v:'계', s:7 }]);
  grid.push([null,null,null,null,null,null,null,null,null,{ f:'SUM(E'+first+':E'+last+')', s:6 }]);
  merges.push('A1:I2');
  heights[0]=22; heights[1]=22;

  // 3~4행: 머리글
  grid.push([{v:'내용',s:7},{v:'규격',s:7},{v:'수량',s:7},{v:'예상단가',s:7},{v:'예상금액',s:7},
             {v:'관련교과',s:7},{v:'제공단위',s:7},{v:'',s:7},{v:'',s:7},{v:'비고',s:7}]);
  grid.push([{v:'',s:7},{v:'',s:7},{v:'',s:7},{v:'',s:7},{v:'',s:7},{v:'',s:7},
             {v:'학년/학급',s:7},{v:'모둠/짝',s:7},{v:'개인',s:7},{v:'',s:7}]);
  ['A','B','C','D','E','F'].forEach(function(c){ merges.push(c+'3:'+c+'4'); });
  merges.push('G3:I3', 'J3:J4');
  heights[2]=20; heights[3]=20;

  // 5행부터 내용
  for (var i=0;i<n;i++){
    var r=rows[i], ln=first+i;
    var mark=function(want){ return (r && r.unitOf===want) ? { v:'O', s:4 } : { v:'', s:4 }; };
    grid.push([
      { v:r?r.name:'', s:3 }, { v:r?r.spec:'', s:3 }, { v:r?r.qty:'', s:4 },
      { v:r?r.unit:'', s:5 },
      (r && (r.qty!=='' && r.unit!=='')) ? { f:'C'+ln+'*D'+ln, s:5 } : { v:r?r.price:'', s:5 },
      { v:r?r.subject:'', s:4 },
      mark('학년/학급'), mark('모둠/짝'), mark('개인'),
      { v:r?r.note:'', s:3 }
    ]);
  }
  return { name:sheetName, widths:W, grid:grid, merges:merges, heights:heights, freeze:'A5' };
}

function copyWeek(off){
  var r=weekRange(off), evs=eventsIn(r.mon,r.sun);
  var due=items().filter(function(it){ return it.due && it.due>=ymd(r.mon) && it.due<=ymd(r.sun); });
  var out=['['+(S.d.grade||6)+'학년 '+(off?'다음 주':'이번 주')+'] '+md(ymd(r.mon))+' ~ '+md(ymd(r.sun)),''];
  if (evs.length){ out.push('■ 일정'); evs.forEach(function(e){ out.push(' · '+md(e.date)+' '+e.text); }); out.push(''); }
  if (due.length){ out.push('■ 수합 마감');
    due.forEach(function(it){ var m=missing(it); out.push(' · '+md(it.due)+' '+it.name.replace(/\s*\([^)]*까지\)\s*/,'')+(m.length?' (미제출: '+m.join(',')+'반)':' (완료)')); }); out.push(''); }
  if (!evs.length && !due.length) out.push('등록된 일정·수합이 없습니다.');
  copyText(out.join('\n').trim()).then(function(){ toast('공지 문구를 복사했어요.'); });
}
function copyRemind(){
  var late=items().filter(function(it){ return missing(it).length; });
  if (!late.length) return toast('미제출이 없어요 😀');
  var by={1:[],2:[],3:[],4:[]};
  late.forEach(function(it){ missing(it).forEach(function(k){ by[k].push(it.name.replace(/\s*\([^)]*까지\)\s*/,'')+(it.due?'('+md(it.due)+')':'')); }); });
  var out=['['+(S.d.grade||6)+'학년 수합 안내] '+md(today()),''];
  ['1','2','3','4'].forEach(function(k){ if (by[k].length) out.push(k+'반: '+by[k].join(' / ')); });
  out.push('','확인 후 제출 부탁드립니다 🙏');
  copyText(out.join('\n')).then(function(){ toast('독촉 문구를 복사했어요.'); });
}
function copyRoster(){

function downloadIcs(){
  var r=weekRange(S.weekOff), evs=eventsIn(r.mon,r.sun);
  if (!evs.length) return toast('내보낼 일정이 없어요.');
  function e(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
  function dd(s){ return s.replace(/-/g,''); }
  function nx(s){ var d=parseYmd(s); d.setDate(d.getDate()+1); return dd(ymd(d)); }
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//grade6-desk//KO','X-WR-CALNAME:'+e((S.d.grade||6)+'학년 일정')];
  evs.forEach(function(x,i){
    L.push('BEGIN:VEVENT','UID:g6-'+dd(x.date)+'-'+i+'@desk','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+dd(x.date),
      'DTEND;VALUE=DATE:'+nx(x.date),'SUMMARY:'+e(x.text),'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'}));
  a.download='6학년_일정.ics'; document.body.appendChild(a); a.click(); a.remove();
  toast('캘린더 파일을 받았어요.');
}
