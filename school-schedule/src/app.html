<title>쌍정 일정함</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 교무수첩 같은 앱: 칠판 초록 + 형광펜 노랑, 위에는 검색·학년 고정, 아래로 날짜별 일정 */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --sunk: #e9eeec; --ink: #17302b; --muted: #5b6e69; --line: #d5dfdc;
  --accent: #0d6a5a; --accent-ink: #ffffff; --marker: #f6d35b; --marker-ink: #3a2e00; --danger: #b3402f;
  --g1: #d9485f; --g2: #e07b22; --g3: #b59000; --g4: #2f9a4a; --g5: #2b7bd0; --g6: #7a4fc9;
  --gstaff: #4d5b58; --gparent: #b0478f; --gspecial: #1f8d93; --gcommon: #7c8a86;
  --f-display: "Do Hyeon", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1816; --surface: #16221f; --sunk: #1d2b28; --ink: #e3ece9; --muted: #93a7a1; --line: #2a3a36;
  --accent: #4fc3a9; --accent-ink: #062b23; --marker: #e7c34a; --marker-ink: #2a2100; --danger: #f08a77;
  --g1: #f2788b; --g2: #f3a35a; --g3: #e2c04a; --g4: #66c97f; --g5: #6aa9ee; --g6: #a98bea;
  --gstaff: #a3b3af; --gparent: #e486c6; --gspecial: #5ccbd1; --gcommon: #8d9c98; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1816; --surface: #16221f; --sunk: #1d2b28; --ink: #e3ece9; --muted: #93a7a1; --line: #2a3a36;
  --accent: #4fc3a9; --accent-ink: #062b23; --marker: #e7c34a; --marker-ink: #2a2100; --danger: #f08a77;
  --g1: #f2788b; --g2: #f3a35a; --g3: #e2c04a; --g4: #66c97f; --g5: #6aa9ee; --g6: #a98bea;
  --gstaff: #a3b3af; --gparent: #e486c6; --gspecial: #5ccbd1; --gcommon: #8d9c98; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 15px/1.55 var(--f-body); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 상단 고정 */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
.brand h1 { margin: 0; font: 26px/1 var(--f-display); letter-spacing: -0.01em; }
.brand h1 span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 12px; }
.search { position: relative; }
.search input { width: 100%; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--sunk); padding: 0 44px 0 42px; font-size: 16px; }
.search input:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.search svg { position: absolute; left: 14px; top: 13px; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
.search .clear { position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; border-radius: 16px; border: 0; background: transparent; color: var(--muted); font-size: 18px; }
.suggest { position: absolute; left: 0; right: 0; top: 48px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px rgb(0 0 0 / .12); overflow: hidden; z-index: 5; }
.suggest button { display: flex; gap: 8px; width: 100%; text-align: left; padding: 10px 14px; border: 0; background: none; border-bottom: 1px solid var(--line); }
.suggest button:last-child { border-bottom: 0; }
.suggest button:hover, .suggest button.on { background: var(--sunk); }
.suggest em { font-style: normal; color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--gcommon)); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

nav.tabs { border-top: 1px solid var(--line); }
.search input::-webkit-search-cancel-button { display: none; -webkit-appearance: none; }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { flex: none; border: 0; background: none; padding: 10px 10px 9px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }

main .wrap { padding-block: 16px 64px; display: grid; gap: 18px; }
.muted { color: var(--muted); }
.status { font-size: 12px; color: var(--muted); }
.status b { color: var(--danger); font-weight: 600; }

/* 일정 */
.dday { display: flex; gap: 8px; flex-wrap: wrap; }
.dday span { font-size: 13px; padding: 4px 10px; border-radius: 6px; background: var(--sunk); }
.dday b { font-family: var(--f-mono); font-weight: 500; margin-left: 4px; }
.weekbar { display: flex; align-items: center; gap: 8px; }
.weekbar h2 { margin: 0; font: 22px/1.1 var(--f-display); flex: 1; min-width: 0; }
.iconbtn { height: 36px; min-width: 36px; padding: 0 10px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 0 12px; height: 34px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.ongoing { border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; }
.ongoing h3 { margin: 0; font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

.day { display: grid; grid-template-columns: 66px 1fr; gap: 12px; }
.day + .day { border-top: 1px solid var(--line); padding-top: 14px; }
.date { text-align: center; padding-top: 2px; }
.date .n { font: 24px/1 var(--f-display); white-space: nowrap; display: block; font-variant-numeric: tabular-nums; }
.date .w { font-size: 12px; color: var(--muted); }
.date.sun .w, .date.hol .w, .date.hol .n { color: var(--danger); }
.date.sat .w { color: var(--g5); }
.day.today .date .n { background: var(--marker); color: var(--marker-ink); border-radius: 8px; padding: 4px 0; }
.day.today .date .w::after { content: "오늘"; display: block; color: var(--accent); font-weight: 600; }
.evs { display: grid; gap: 8px; min-width: 0; }
.note { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
.ev { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.ev.hol { background: transparent; border-style: dashed; color: var(--danger); font-weight: 600; }
.ev .t { overflow-wrap: anywhere; }
.ev .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 11.5px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.span { font-family: var(--f-mono); font-size: 11.5px; }
mark { background: var(--marker); color: var(--marker-ink); border-radius: 2px; padding: 0 1px; }

/* 검색 결과 */
.sec h2 { margin: 0 0 8px; font: 20px/1.2 var(--f-display); display: flex; gap: 8px; align-items: baseline; }
.sec h2 small { font: 13px var(--f-body); color: var(--muted); }
.hit { display: grid; grid-template-columns: 72px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.hit .d { font-family: var(--f-mono); font-size: 13px; color: var(--muted); padding-top: 2px; }
.hit .d.today { color: var(--accent); font-weight: 600; }
.rowhit { padding: 10px 0; border-top: 1px solid var(--line); display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.rowhit small { color: var(--accent); font-weight: 600; font-size: 12px; }
button.linkish { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; }

/* 표 */
.sub { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.sub::-webkit-scrollbar { display: none; }
.sub .chip { flex: none; }
.sub.small .chip { height: 28px; font-size: 12.5px; padding: 0 10px; }

/* 업무 참고 — 휴대폰용 묶음 보기 */
.stack { display: grid; gap: 10px; }
.grp { margin: 6px 0 0; font: 18px/1.2 var(--f-display); }
.grp:first-child { margin-top: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.card h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; }
.card h3 .no { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-right: 6px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 0; }
.facts dt { color: var(--muted); white-space: nowrap; }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; white-space: pre-line; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--sunk); }
.pill.yes { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font-weight: 600; }
.pill.warn { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); font-weight: 600; }
details.card > summary { list-style: none; cursor: pointer; display: grid; gap: 8px; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary h3::after { content: " +"; color: var(--muted); font-weight: 400; }
details.card[open] > summary h3::after { content: " −"; }
.grades { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; text-align: center; font-size: 12px; }
.grades span { background: var(--sunk); border-radius: 4px; padding: 3px 0; font-variant-numeric: tabular-nums; }
.grades span b { display: block; font-size: 10.5px; color: var(--muted); font-weight: 500; }
.grades span.off { opacity: .45; }
.ext { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 14px; }
.ext > div { display: contents; }
.ext span { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; min-width: 0; }
.ext > div:first-child span { border-top: 0; }
.ext .num { font-family: var(--f-mono); color: var(--accent); text-align: right; white-space: nowrap; }
.ext small { color: var(--muted); margin-left: 6px; }
.mini { width: 100%; table-layout: fixed; font-size: 13px; }
.mini td { text-align: center; padding: 5px 2px; min-width: 0; }
.mini td:first-child { text-align: left; padding-left: 8px; }
.mini.wide td:first-child { width: 42%; }
.mini td.num { font-variant-numeric: tabular-nums; }
.mini tr.sum td { font-weight: 600; background: var(--sunk); }
.mini tr.cat td { background: transparent; border-left-color: transparent; border-right-color: transparent; color: var(--accent); font-weight: 600; text-align: left; padding-top: 12px; }
.box-title { font-weight: 600; font-size: 14px; margin: 0 0 6px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.tile { background: var(--sunk); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.models b.key { font-family: var(--f-mono); color: var(--accent); margin-right: 6px; }
.tile .loc { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tile .cnt { font: 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.tile .cnt small { font: 12px var(--f-body); color: var(--muted); margin-left: 2px; }
.tile.zero { opacity: .5; }
.tile .sub2 { font-size: 11.5px; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }
.tile .ok { color: var(--accent); }
.tile .warn { color: var(--danger); }
.models { display: grid; gap: 4px; font-size: 13px; }
.models div { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 4px; }
.models div:first-child { border-top: 0; padding-top: 0; }
.models code { font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere; }
.models span { white-space: nowrap; font-variant-numeric: tabular-nums; }
.notebox { font-size: 13px; color: var(--muted); white-space: pre-line; }
.notebox a { color: var(--accent); }
@media (max-width: 520px) {
  table { font-size: 12px; }
  td { padding: 4px 6px; }
  .tablebox td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
  .tablebox td.h:first-child { background: var(--sunk); }
}
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; white-space: pre-line; min-width: 2.5em; }
td.h { background: var(--sunk); font-weight: 600; }
td.blank { border-color: transparent; }
td a { color: var(--accent); }
.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.links a { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: inherit; text-decoration: none; }
.links a:hover { border-color: var(--accent); }
.links a b { font-weight: 600; }
.links a span { font-size: 12px; color: var(--muted); }

/* 보안 · 알림 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.panel h2 { margin: 0; font: 22px/1.2 var(--f-display); }
.panel p { margin: 0; }
.code { display: flex; gap: 8px; flex-wrap: wrap; }
.code input { width: 9em; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); text-align: center; font: 22px var(--f-mono); letter-spacing: .4em; }
.btn { height: 44px; padding: 0 18px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { background: var(--sunk); color: var(--ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toggle { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.toggle input { flex: none; width: 20px; height: 20px; accent-color: var(--accent); margin-top: 2px; }
.toggle small { display: block; color: var(--muted); }
.msg { font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--sunk); }
.msg.err { color: var(--danger); }
ol.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
nav.tabs .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; vertical-align: 1px; }

/* 수합 · 공지 */
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bar select, .field input, .field textarea { height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; font-size: 15px; }
.field textarea { height: auto; min-height: 84px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
.field { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
.field input, .field textarea { width: 100%; font-weight: 400; }
.field small { font-weight: 400; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
.post { display: grid; gap: 10px; }
.post .head { display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; }
.post h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.post .who { font-size: 12px; color: var(--muted); }
.due { flex: none; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--sunk); white-space: nowrap; }
.due.soon { background: var(--marker); color: var(--marker-ink); }
.due.late { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.due.ok { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.prog { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.prog .track { flex: 1; height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.prog .fill { height: 100%; background: var(--accent); border-radius: 4px; }
.prog b { font-variant-numeric: tabular-nums; }
.cls-grid { display: grid; gap: 6px; }
.cls-row { display: grid; grid-template-columns: 40px 1fr; gap: 6px; align-items: center; }
.cls-row > span { font-size: 12px; color: var(--muted); }
.cls-cells { display: flex; flex-wrap: wrap; gap: 6px; }
.cls { min-width: 56px; height: 40px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.cls[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cls[aria-pressed="true"]::before { content: "✓"; }
.cls.mine { box-shadow: 0 0 0 2px var(--marker); }
.left { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.left b { color: var(--danger); font-weight: 600; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
.btn.sm { height: 36px; padding: 0 12px; font-size: 13px; }
.btn.warnbtn { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
.notice-body { white-space: pre-line; overflow-wrap: anywhere; }
.post.today { border-color: var(--marker); box-shadow: inset 4px 0 0 var(--marker); }
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 14px; display: flex; gap: 12px; align-items: center; background: var(--surface); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.drop .ico { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--sunk); font: 18px var(--f-display); color: var(--accent); }
.drop .txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.drop .txt b { font-size: 14px; }
.drop .txt span { font-size: 12px; color: var(--muted); }
.drop label.btn { flex: none; display: inline-flex; align-items: center; cursor: pointer; }
.drop input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop.busy { opacity: .7; pointer-events: none; }
.aibanner { font-size: 13px; padding: 8px 12px; border-radius: 8px; background: color-mix(in srgb, var(--marker) 30%, transparent); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ex { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--sunk); color: var(--muted); margin-left: 6px; vertical-align: 2px; }
details.past > summary { cursor: pointer; font-weight: 600; color: var(--muted); padding: 6px 0; }
details.past[open] > summary { margin-bottom: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>쌍정 <span>일정함</span></h1>
      <small id="updated">불러오는 중…</small>
    </div>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="일정, 담당자, 특별실, 내선번호 검색" autocomplete="off" aria-label="검색">
      <button class="clear" id="qclear" aria-label="검색어 지우기" hidden>×</button>
      <div class="suggest" id="suggest" hidden></div>
    </div>
    <div class="chips" id="filter" aria-label="학년 선택"></div>
  </div>
  <nav class="tabs" role="tablist"><div class="wrap" id="tabs"></div></nav>
</header>

<main><div class="wrap" id="view"></div></main>

<script>
/*__BOOT__*/
</script>
<script>
/*__PARSE__*/

const DEMO = !!window.__DEMO__;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('sj.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sj.' + k, JSON.stringify(v)); } catch {} },
};
const COLOR = { '1': '--g1', '2': '--g2', '3': '--g3', '4': '--g4', '5': '--g5', '6': '--g6', staff: '--gstaff', parent: '--gparent', special: '--gspecial', common: '--gcommon' };
const SHORT = { staff: '교직원', parent: '학부모', special: '통합', common: '공통' };
const TABS = [['sched', '일정'], ['collect', '수합'], ['notice', '공지'], ['ref', '업무 참고'], ['lock', '보안'], ['alarm', '알림']];

let DATA = null, EVENTS = [], NOTES = [], SECURE = null;
const today = new Date(); today.setHours(0, 0, 0, 0);
const TODAY = ymd(today);
const mondayOf = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const st = {
  tab: 'sched', view: LS.get('view', 'week'), filter: LS.get('filter', []), q: '',
  week: mondayOf(today), month: new Date(today.getFullYear(), today.getMonth(), 1), ref: null,
};
const qd = new URLSearchParams(location.search).get('d');
const qtab = new URLSearchParams(location.search).get('tab');
if (qtab && ['sched', 'collect', 'notice', 'ref', 'lock', 'alarm'].includes(qtab)) st.tab = qtab;
if (qd && /^\d{4}-\d{2}-\d{2}$/.test(qd)) { const [y, m, d] = qd.split('-').map(Number); st.week = mondayOf(new Date(y, m - 1, d)); st.view = 'week'; }

/* ---------- 자료 ---------- */
function setData(d) {
  DATA = d;
  const r = parseSchedule(d.schedule, d.year || today.getFullYear());
  EVENTS = r.events; NOTES = r.notes;
  const at = d.updatedAt ? new Date(d.updatedAt) : null;
  $('#updated').textContent = at ? `시트 반영 ${at.getMonth() + 1}.${at.getDate()} ${String(at.getHours()).padStart(2, '0')}:${String(at.getMinutes()).padStart(2, '0')}` : '';
  buildVocab();
  render();
}
async function load() {
  if (DEMO) return setData(window.__DEMO__);
  const cached = LS.get('data', null);
  if (cached) setData(cached);
  try {
    const res = await fetch('/api/data', { cache: 'no-store' });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.status);
    LS.set('data', d); setData(d);
  } catch (e) {
    if (!cached) { $('#updated').textContent = ''; $('#view').innerHTML = `<p class="msg err">자료를 불러오지 못했습니다. ${esc(e.message)}</p>`; }
    else $('#updated').innerHTML = '<b>오프라인</b> · 저장된 자료';
  }
}

/* ---------- 필터 ---------- */
function visible(ev) {
  if (!st.filter.length) return true;
  return ev.groups.some(g => st.filter.includes(g) || g === 'common');
}
function renderFilter() {
  const all = `<button class="chip" data-g="" aria-pressed="${!st.filter.length}">전체</button>`;
  $('#filter').innerHTML = all + GROUPS.filter(g => g.id !== 'common').map(g =>
    `<button class="chip" data-g="${g.id}" style="--c:var(${COLOR[g.id]})" aria-pressed="${st.filter.includes(g.id)}"><i></i>${g.label}</button>`).join('');
}
$('#filter').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const g = b.dataset.g;
  st.filter = !g ? [] : (st.filter.includes(g) ? st.filter.filter(x => x !== g) : [...st.filter, g]);
  LS.set('filter', st.filter); renderFilter(); render();
});

/* ---------- 탭 ---------- */
function renderTabs() {
  const badge = { collect: boardBadge('collect'), notice: boardBadge('notice') };
  $('#tabs').innerHTML = TABS.map(([id, label]) => `<button role="tab" data-tab="${id}" aria-selected="${st.tab === id && !st.q}">${label}${badge[id] ? `<span class="badge">${badge[id]}</span>` : ''}</button>`).join('');
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  st.tab = b.dataset.tab; setQ(''); window.scrollTo(0, 0);
});

/* ---------- 일정 그리기 ---------- */
const tags = ev => ev.groups.length === 0 ? '' : (ev.groups.filter(g => /^\d$/.test(g)).length === 6
  ? `<span class="tag" style="--c:var(--accent)">전교</span>` + ev.groups.filter(g => !/^\d$/.test(g)).map(tagOne).join('')
  : ev.groups.map(tagOne).join(''));
const tagOne = g => `<span class="tag" style="--c:var(${COLOR[g]})">${/^\d$/.test(g) ? g + '학년' : SHORT[g]}</span>`;
const spanTxt = ev => ev.end ? `<span class="span">~${+ev.end.slice(5, 7)}.${+ev.end.slice(8)}</span>` : '';

function hl(text, q) {
  const t = esc(text);
  if (!q) return t;
  const parts = q.split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!parts.length) return t;
  return t.replace(new RegExp('(' + parts.join('|') + ')', 'gi'), '<mark>$1</mark>');
}
function evCard(ev, q = '') {
  if (ev.holiday) return `<div class="ev hol">${hl(ev.text, q)}</div>`;
  return `<div class="ev"><div class="t">${hl(ev.text, q)}</div><div class="meta">${tags(ev)}${spanTxt(ev)}${ev.owner ? `<span>· ${hl(ev.owner, q)}</span>` : ''}</div></div>`;
}
function dayBlock(key, list, notes, showEmpty) {
  const [y, m, d] = key.split('-').map(Number);
  const dt = new Date(y, m - 1, d), w = dt.getDay();
  const hol = list.some(e => e.holiday);
  const cls = ['date', w === 0 ? 'sun' : '', w === 6 ? 'sat' : '', hol ? 'hol' : ''].join(' ');
  const body = list.length ? list.map(e => evCard(e)).join('') : (showEmpty ? '<div class="empty">일정 없음</div>' : '');
  return `<section class="day${key === TODAY ? ' today' : ''}" id="d-${key}">
    <div class="${cls}"><span class="n">${m}.${d}</span><span class="w">${WEEK[w]}요일</span></div>
    <div class="evs">${notes.length ? `<div class="note">${esc(notes.map(n => n.text).join(' · '))}</div>` : ''}${body}</div></section>`;
}
function ddays() {
  const out = [];
  const find = re => EVENTS.find(e => re.test(e.text) && e.date >= TODAY);
  const end = find(/졸업식|종업식/); if (end) out.push(['종업식·졸업식', end.date]);
  const vac = find(/방학식/); if (vac) out.push(['방학식', vac.date]);
  const hol = EVENTS.find(e => e.holiday && e.date > TODAY); if (hol) out.push([hol.text, hol.date]);
  return out.map(([n, d]) => {
    const [y, m, dd] = d.split('-').map(Number);
    const diff = Math.round((new Date(y, m - 1, dd) - today) / 864e5);
    return `<span>${esc(n)} <b>D-${diff}</b></span>`;
  }).join('');
}
function renderSched() {
  const v = st.view;
  let head, body;
  if (v === 'week') {
    const days = [...Array(7)].map((_, i) => { const d = new Date(st.week); d.setDate(d.getDate() + i); return ymd(d); });
    const s = days[0], e = days[6];
    const ongoing = EVENTS.filter(ev => ev.end && ev.date < s && ev.end >= s && visible(ev));
    head = `${+s.slice(5, 7)}.${+s.slice(8)} – ${+days[4].slice(5, 7)}.${+days[4].slice(8)}`;
    body = (ongoing.length ? `<div class="ongoing"><h3>진행 중</h3>${ongoing.map(x => evCard(x)).join('')}</div>` : '') +
      days.map((k, i) => {
        const list = EVENTS.filter(ev => ev.date === k && visible(ev));
        const notes = NOTES.filter(n => n.date === k);
        if (i >= 5 && !list.length) return '';
        return dayBlock(k, list, notes, true);
      }).join('');
  } else {
    const y = st.month.getFullYear(), m = st.month.getMonth();
    const pre = `${y}-${String(m + 1).padStart(2, '0')}`;
    const keys = [...new Set(EVENTS.filter(ev => ev.date.startsWith(pre) && visible(ev)).map(ev => ev.date))].sort();
    head = `${y}년 ${m + 1}월`;
    body = keys.length ? keys.map(k => dayBlock(k, EVENTS.filter(ev => ev.date === k && visible(ev)), NOTES.filter(n => n.date === k), false)).join('')
      : '<p class="empty">이 달에는 선택한 학년 일정이 없습니다.</p>';
  }
  const isNow = v === 'week' ? ymd(st.week) === ymd(mondayOf(today)) : (st.month.getFullYear() === today.getFullYear() && st.month.getMonth() === today.getMonth());
  $('#view').innerHTML = `
    <div class="dday">${ddays()}</div>
    <div class="weekbar">
      <button class="iconbtn" data-nav="-1" aria-label="이전">‹</button>
      <h2>${head}</h2>
      ${isNow ? '' : `<button class="iconbtn" data-nav="0">오늘</button>`}
      <button class="iconbtn" data-nav="1" aria-label="다음">›</button>
    </div>
    <div class="row"><div class="seg"><button data-view="week" aria-pressed="${v === 'week'}">주간</button><button data-view="month" aria-pressed="${v === 'month'}">월간</button></div>
      <span class="status">${st.filter.length ? '선택한 학년 + 학교 공통 일정' : '모든 일정'}</span></div>
    <div style="display:grid;gap:14px">${body}</div>`;
  if (v === 'week') { const t = document.getElementById('d-' + (qd || TODAY)); if (t && !renderSched.done) { renderSched.done = 1; setTimeout(() => t.scrollIntoView({ block: 'center' }), 50); } }
}
$('#view').addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]'), vw = e.target.closest('[data-view]');
  if (nav) {
    const n = +nav.dataset.nav;
    if (st.view === 'week') { if (n === 0) st.week = mondayOf(today); else st.week.setDate(st.week.getDate() + 7 * n); }
    else { st.month = n === 0 ? new Date(today.getFullYear(), today.getMonth(), 1) : new Date(st.month.getFullYear(), st.month.getMonth() + n, 1); }
    render();
  }
  if (vw) { st.view = vw.dataset.view; LS.set('view', st.view); render(); }
});

/* ---------- 표 ---------- */
function trim(rows) {
  rows = (rows || []).map(r => (r || []).map(c => String(c ?? '')));
  let w = 0; rows.forEach(r => r.forEach((c, i) => { if (c.trim()) w = Math.max(w, i + 1); }));
  rows = rows.map(r => Array.from({ length: w }, (_, i) => r[i] || ''));
  while (rows.length && !rows[rows.length - 1].some(c => c.trim())) rows.pop();
  while (rows.length && !rows[0].some(c => c.trim())) rows.shift();
  // 연속 빈 행은 하나로
  return rows.filter((r, i) => r.some(c => c.trim()) || (rows[i - 1] && rows[i - 1].some(c => c.trim())));
}
// 열 전체가 빈 칸이면 빼기
function dropEmptyCols(rows) {
  if (!rows.length) return rows;
  const keep = rows[0].map((_, i) => rows.some(r => (r[i] || '').trim()));
  return rows.map(r => r.filter((_, i) => keep[i]));
}
const phone = s => esc(s).replace(/(0\d{1,2}-\d{3,4}-\d{4})/g, '<a href="tel:$1">$1</a>');
function tableHTML(rows, q = '') {
  rows = dropEmptyCols(trim(rows));
  if (!rows.length) return '<p class="empty">내용이 없습니다.</p>';
  const isHead = r => r.filter(c => c.trim()).length <= 1 || /^(구 ?분|월|실 ?명|연번|행 ?사 ?명|내 ?용|순|소속|날짜)$/.test((r.find(c => c.trim()) || '').trim());
  return `<div class="tablebox"><table>${rows.map(r => `<tr>${r.map(c => {
    const v = c.trim(); const h = isHead(r) && v;
    return `<td class="${h ? 'h' : ''}${!v && !r.some(x => x.trim()) ? ' blank' : ''}">${q ? hl(c, q) : phone(c)}</td>`;
  }).join('')}</tr>`).join('')}</table></div>`;
}
function linksHTML() {
  const L = DATA.links || [];
  if (!L.length) return '<p class="empty">링크가 없습니다.</p>';
  return `<div class="links">${L.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener"><b>${esc(l.title)}</b>${l.note ? `<span>${esc(l.note)}</span>` : ''}</a>`).join('')}</div>`;
}
/* ---------- 업무 참고: 표를 휴대폰에 맞게 다시 묶기 ---------- */
const cell = (r, i) => String((r || [])[i] ?? '').trim();
const oneLine = v => String(v ?? '').replace(/\s*\n\s*/g, ' ').trim();
const clean = v => String(v ?? '').replace(/[-]|[\u{F0000}-\u{FFFFD}]/gu, '').trim();
const isOX = v => /^[O○]/.test(v) ? 'yes' : /^[X×]/.test(v) ? 'no' : '';

// 필수 연수 — 연수 하나를 카드 하나로
function viewTraining(rows) {
  const items = [];
  rows.forEach(r => {
    if (/^\d+$/.test(cell(r, 0))) items.push({ r, extra: [] });
    else if (items.length && r.some(c => String(c).trim())) items[items.length - 1].extra.push(r.map(c => String(c).trim()).filter(Boolean).join(' '));
  });
  if (!items.length) return null;
  return `<p class="status">${items.length}개 연수 · 카드를 누르면 근거 법령과 담당 부처가 보입니다.</p><div class="stack">${items.map(({ r, extra }) => {
    const submit = cell(r, 17), penalty = cell(r, 18), remote = cell(r, 16);
    const sub = isOX(submit), pen = isOX(penalty);
    return `<details class="card"><summary>
      <h3><span class="no">${esc(cell(r, 0))}</span>${esc(oneLine(cell(r, 1)))}</h3>
      <dl class="facts"><dt>연간 시수</dt><dd>${esc(oneLine(cell(r, 4)) || '-')}</dd></dl>
      <div class="pills">
        <span class="pill ${sub === 'yes' ? 'yes' : ''}">실적 제출 ${sub === 'yes' ? esc(oneLine(submit).replace(/^[O○]\s*/, '') || '필요') : '없음'}</span>
        ${pen === 'yes' ? `<span class="pill warn">미이수 시 ${esc(oneLine(penalty).replace(/^[O○]\s*/, '') || '제재')}</span>` : ''}
        ${remote ? `<span class="pill">원격 1차시 1시간 ${isOX(remote) === 'yes' ? '인정' : '미인정'}</span>` : ''}
      </div></summary>
      <dl class="facts">
        <dt>근거 법령</dt><dd>${esc(cell(r, 2))}</dd>
        <dt>소관 부처</dt><dd>${esc(cell(r, 3))}</dd>
        ${cell(r, 15) ? `<dt>교육자료</dt><dd>${esc(cell(r, 15))}</dd>` : ''}
        ${extra.length ? `<dt>참고</dt><dd>${esc(extra.join('\n'))}</dd>` : ''}
      </dl></details>`;
  }).join('')}</div>`;
}

// 교육과정 편제 — 학년을 골라 그 학년 올해 시수만
function viewCurriculum(rows) {
  const blocks = [];
  rows.forEach((r, i) => { const g = cell(r, 8); if (/^[1-6]학년$/.test(g)) blocks.push({ name: g, start: i }); });
  if (!blocks.length) return null;
  blocks.forEach((b, k) => b.end = k + 1 < blocks.length ? blocks[k + 1].start : rows.length);
  const names = [...blocks.map(b => b.name), '국가 기준'];
  if (!names.includes(st.pj)) st.pj = names.find(n => n === LS.get('pj', '')) || (st.filter.find(f => /^\d$/.test(f)) ? st.filter.find(f => /^\d$/.test(f)) + '학년' : names[0]);
  if (!names.includes(st.pj)) st.pj = names[0];
  const chips = `<div class="sub small">${names.map(n => `<button class="chip" data-pj="${n}" aria-pressed="${n === st.pj}">${n}</button>`).join('')}</div>`;
  if (st.pj === '국가 기준') {
    const nat = rows.map(r => [1, 2, 3, 4, 5].map(i => cell(r, i))).filter(r => r.some(Boolean));
    const head = nat.findIndex(r => r.includes('1-2학년군'));
    const body = nat.slice(head + 1);
    let cat = '';
    return chips + `<p class="status">2022 개정 교육과정 학년군별 시간 배당</p><div class="tablebox"><table class="mini wide">
      <tr><td class="h">교과(군)</td><td class="h">1-2</td><td class="h">3-4</td><td class="h">5-6</td></tr>
      ${body.map(r => {
        if (r[0]) cat = r[0];
        const label = r[1] || r[0];
        const v12 = /\n/.test(r[2]) ? '통합' : r[2];
        return `<tr class="${/소계|총/.test(label) ? 'sum' : ''}"><td>${esc(oneLine(label))}</td><td class="num">${esc(v12)}</td><td class="num">${esc(r[3])}</td><td class="num">${esc(r[4])}</td></tr>`;
      }).join('')}</table></div>
      <p class="notebox">1-2학년군 교과: 국어 482 · 수학 256 · 바른 생활 144 · 슬기로운 생활 224 · 즐거운 생활 400</p>`;
  }
  const b = blocks.find(x => x.name === st.pj);
  const part = rows.slice(b.start, b.end);
  const top = part[1] || [], subh = part.findIndex(r => r.some(c => String(c).trim() === '1학기'));
  const a = (part[subh] || []).findIndex(c => String(c).trim() === '1학기');
  const base = top.findIndex(c => /국가기준/.test(String(c)));
  const yearTitle = oneLine(top.slice(base + 1).find(c => /학년도/.test(String(c)) && String(c).includes(b.name)) || '');
  let cat = '';
  const trs = part.slice(subh + 1).filter(r => r.some(c => String(c).trim())).map(r => {
    const c8 = cell(r, 8);
    const subj = [];
    for (let i = 9; i < base; i++) if (cell(r, i)) subj.push(cell(r, i));
    let label = subj.join(' · ') || c8;
    let catRow = '';
    if (c8 && c8 !== cat && c8 !== '계') { cat = c8; catRow = `<tr class="cat"><td colspan="5">${esc(c8)}</td></tr>`; }
    if (subj[0] && subj.length > 1 && subj[0] === (r._prev || '')) label = subj[1];
    const sum = /소계|^계$/.test(subj[subj.length - 1] || c8) || c8 === '계';
    if (c8 === '계') label = '총 시수';
    const v = i => esc(oneLine(cell(r, i)));
    return catRow + `<tr class="${sum ? 'sum' : ''}"><td>${esc(label)}</td><td class="num">${v(a)}</td><td class="num">${v(a + 1)}</td><td class="num">${v(a + 2)}</td><td class="num">${v(base)}</td></tr>`;
  }).join('');
  return chips + `<p class="status">${esc(yearTitle || b.name)} 편성 시수 · 기준은 학년군(2년) 국가 기준</p>
    <div class="tablebox"><table class="mini wide">
    <tr><td class="h">과목</td><td class="h">1학기</td><td class="h">2학기</td><td class="h">계</td><td class="h">기준</td></tr>${trs}</table></div>`;
}

// 행사 일정 — 행사 하나를 카드 하나로, 학년별 시간은 6칸
function viewEvents(rows) {
  let html = '', n = 0;
  rows.forEach(r => {
    const sem = r.map(c => String(c).trim()).find(c => /^\(\d학기\)$/.test(c));
    if (sem) { html += `<h2 class="grp">${sem.replace(/[()]/g, '')}</h2>`; return; }
    const name = cell(r, 0), date = cell(r, 1);
    if (!name || !date || /행\s*사\s*명/.test(name)) return;
    n++;
    const g = [2, 3, 4, 5, 6, 7].map((i, k) => { const v = cell(r, i).replace(/[․·]/g, '').trim(); return `<span class="${v ? '' : 'off'}"><b>${k + 1}학년</b>${v ? esc(v) + 'h' : '-'}</span>`; }).join('');
    html += `<div class="card"><div><h3>${esc(oneLine(name))}</h3><div class="status">${esc(date)}${cell(r, 8) ? ' · ' + esc(cell(r, 8)) : ''}</div></div><div class="grades">${g}</div></div>`;
  });
  return n ? `<div class="stack">${html}</div>` : null;
}

// 내선번호 — 층별 목록
function viewExtension(rows) {
  const hi = rows.findIndex(r => /실\s*명/.test(cell(r, 0)));
  if (hi < 0) return null;
  const note = rows.slice(0, hi).map(r => r.map(c => String(c).trim()).filter(Boolean).join(' ')).filter(Boolean).join('\n');
  const floors = new Map();
  for (const off of [0, 5]) {
    let floor = '', room = '';
    rows.slice(hi + 1).forEach(r => {
      if (cell(r, off)) floor = cell(r, off);
      const rm = cell(r, off + 1).replace(/\s+/g, ' ');
      const ext = cell(r, off + 2), who = cell(r, off + 3).replace(/(?<=[가-힣]) (?=[가-힣])/g, '');
      if (rm) room = rm;
      if (!ext) return;
      if (!floors.has(floor)) floors.set(floor, []);
      floors.get(floor).push({ room: rm || room, ext, who, cont: !rm });
    });
  }
  const order = [...floors.keys()].sort((x, y) => parseInt(x) - parseInt(y));
  return `${note ? `<p class="notebox">${phone(note.replace(/ (?=[가-힣]+\(?F?A?X?\)?:)/g, '\n'))}</p>` : ''}
    <div class="stack">${order.map(f => `<h2 class="grp">${esc(f)}</h2><div class="ext">${floors.get(f).map(x =>
      `<div><span>${x.cont ? '<span class="muted">└</span> ' : ''}${esc(x.cont ? '' : x.room.replace(/(?<=[가-힣]) (?=[가-힣])/g, ''))}${x.who ? `<small>${esc(x.who)}</small>` : ''}</span><span class="num">${esc(x.ext)}</span></div>`).join('')}</div>`).join('')}</div>`;
}

// 특별실 시간표 — 나란히 붙은 표를 실마다 한 개씩
function viewRooms(rows) {
  const blocks = [];
  rows.forEach((r, i) => {
    for (const off of [0, 6]) {
      const part = [0, 1, 2, 3, 4, 5].map(k => cell(r, off + k));
      if (part[0] && !/^\d+$/.test(part[0]) && !part.slice(1).some(Boolean)) blocks.push({ title: part[0], i, off, rows: [] });
      else {
        const b = [...blocks].reverse().find(x => x.off === off);
        if (b && part.some(Boolean)) b.rows.push(part);
      }
    }
  });
  if (!blocks.length) return null;
  blocks.sort((x, y) => x.i - y.i || x.off - y.off);
  const fmt = v => /^\d$/.test(v) ? v + '학년' : v;
  return `<div class="stack">${blocks.map(b => {
    const body = b.rows.filter(r => !r[1] && r.slice(1).every(x => !x) ? false : true);
    return `<div class="card"><p class="box-title">${esc(b.title)}</p><table class="mini">${body.map(r => {
      const head = r[1] === '월';
      return `<tr>${r.map((c, k) => `<td class="${head || k === 0 ? 'h' : ''}">${esc(k === 0 ? (c ? c + (head ? '' : '교시') : '') : (head ? c : fmt(c)))}</td>`).join('')}</tr>`;
    }).join('')}</table></div>`;
  }).join('')}</div>`;
}

// 학사일정 — 행사·휴업일이 있는 주만 목록으로
function viewAcademic(rows) {
  const out = { 1: [], 2: [] }, notes = new Set();
  rows.forEach(r => {
    [[0, 1], [13, 2]].forEach(([o, sem]) => {
      const mo = cell(r, o), wk = cell(r, o + 1);
      if (/^\d+$/.test(mo)) out[sem].month = mo;
      const ev = clean(cell(r, o + 9)), off = clean(cell(r, o + 10));
      if (/소계|총계/.test(mo)) { if (ev) notes.add(ev.replace(/^◈/, '')); return; }
      if (!/^\d+$/.test(wk) || (!ev && !off)) return;
      const d1 = cell(r, o + 2), d2 = cell(r, o + 6);
      out[sem].push({ m: out[sem].month, wk, range: d1 && d2 ? (+d2 < +d1 ? `${d1}일~${+out[sem].month % 12 + 1}.${d2}` : `${d1}~${d2}일`) : '', ev, off });
    });
  });
  if (!out[1].length && !out[2].length) return null;
  const list = sem => out[sem].map(x => `<div class="card"><h3><span class="no">${x.wk}주</span>${esc(x.m)}월 ${esc(x.range)}</h3>
    ${x.ev ? `<div class="notebox" style="color:var(--ink)">${esc(x.ev.replace(/\n\s*/g, '\n'))}</div>` : ''}
    ${x.off ? `<div class="notebox" style="color:var(--danger)">${esc(x.off)}</div>` : ''}</div>`).join('');
  return `${notes.size ? `<div class="pills">${[...notes].map(n => `<span class="pill">${esc(n)}</span>`).join('')}</div>` : ''}
    <h2 class="grp">1학기</h2><div class="stack">${list(1)}</div><h2 class="grp">2학기</h2><div class="stack">${list(2)}</div>`;
}

// 기기 대장 — 기기 종류마다 카드, 학급·실별 수량을 타일로
function viewDevices(rows) {
  const isNum = v => /^\d+$/.test(v);
  const isModel = v => /^[A-Z0-9]{2,}[\/-][A-Z0-9-]+/.test(v) || /^SM-/.test(v);
  const blocks = [];
  rows.forEach(r => {
    const filled = r.map(c => String(c).trim()).filter(Boolean);
    if (filled.length === 1 && cell(r, 0) && /수량|대장/.test(cell(r, 0))) blocks.push({ title: cell(r, 0), rows: [] });
    else if (blocks.length) blocks[blocks.length - 1].rows.push(r.map(c => String(c ?? '').trim()));
  });
  if (!blocks.length) return null;
  const tile = (loc, n, extra = '') => `<div class="tile${n === '0' || n === '' ? ' zero' : ''}"><span class="loc">${esc(loc)}</span><span class="cnt">${n === '' ? '-' : esc(n)}<small>${n === '' ? '' : '대'}</small></span>${extra}</div>`;

  return `<div class="stack">${blocks.map(b => {
    const R = b.rows.filter(r => r.some(Boolean));
    const head = R[0] || [];
    const modelRows = [];
    for (const r of R.slice(1)) { if (isModel(r[0]) && r.slice(1).some(isNum)) modelRows.push(r); else break; }
    const KEY = 'ABCDEFGH';
    // 표 모양: 첫 줄이 장소, 바로 아래 줄들이 모델별 수량 (웨일북)
    if (modelRows.length > 1) {
      const sumCols = head.map((h, i) => /총|등록/.test(h) ? i : -1).filter(i => i >= 0);
      const locCols = head.map((h, i) => i > 0 && h && !sumCols.includes(i) ? i : -1).filter(i => i >= 0);
      const total = R.slice(1).find(r => !r[0] && r.slice(1).some(isNum));
      const status = R.find(r => /이상/.test(r[0]));
      const keep = R.slice(1).find(r => !r[0] && r.slice(1).some(v => /보관/.test(v)));
      const tiles = locCols.map(i => {
        const parts = modelRows.map((r, m) => isNum(r[i]) && r[i] !== '0' ? `${KEY[m]} ${r[i]}` : '').filter(Boolean);
        const st_ = status && status[i], kp = keep && keep[i];
        const extra = `${st_ ? `<span class="sub2 ${/이상없음/.test(st_) ? 'ok' : 'warn'}">${esc(st_)}</span>` : ''}${kp ? `<span class="sub2">${esc(kp)}</span>` : ''}${parts.length > 1 ? `<span class="sub2">${esc(parts.join(' · '))}</span>` : ''}`;
        return tile(head[i], total ? total[i] : '', extra);
      }).join('');
      const models = modelRows.map((r, m) => {
        const [t, reg] = sumCols.map(i => r[i]);
        const diff = t && reg && t !== reg;
        return `<div><code><b class="key">${KEY[m]}</b>${esc(r[0])}</code><span>${esc(t || '-')}대${reg ? ` <span class="muted">/ 대장 ${esc(reg)}</span>` : ''}${diff ? ' <b style="color:var(--danger)">차이</b>' : ''}</span></div>`;
      }).join('');
      const all = total && sumCols.length ? total[sumCols[0]] : '';
      return `<div class="card"><h3>${esc(b.title)}${all ? ` <span class="muted" style="font-weight:400">· 총 ${esc(all)}대</span>` : ''}</h3>
        <div class="tiles">${tiles}</div>
        <div class="models">${models}</div>
        ${status && cell(status, 0) ? `<p class="status">${esc(status[0])} 기준</p>` : ''}</div>`;
    }
    // 장소 줄 + 수량 줄이 번갈아 나오는 모양 (노트북·태블릿)
    const items = [], sums = [], models = new Set();
    R.forEach(r => r.forEach(v => { if (isModel(v)) models.add(oneLine(v).split(/[(,]/)[0].trim()); }));
    for (let k = 0; k < R.length; k++) {
      const h = R[k], v = R[k + 1] || [];
      const labels = h.map((x, i) => i > 0 && x && !isNum(x) ? i : -1).filter(i => i >= 0);
      if (!labels.length || labels.length < h.slice(1).filter(Boolean).length / 2) continue;
      labels.forEach(i => {
        const lab = h[i], val = isNum(v[i]) ? v[i] : '';
        if (isModel(lab) || /총/.test(lab)) { if (val) sums.push([lab, val]); }
        else items.push([lab, val]);
      });
      k++;
    }
    const total = sums.find(([l]) => /총/.test(l)) || sums[0];
    const used = items.reduce((a, [, n]) => a + (+n || 0), 0);
    return `<div class="card"><h3>${esc(b.title)}${total ? ` <span class="muted" style="font-weight:400">· 총 ${esc(total[1])}대</span>` : ''}</h3>
      ${models.size ? `<div class="pills">${[...models].map(m => `<span class="pill"><code>${esc(m)}</code></span>`).join('')}</div>` : ''}
      <div class="tiles">${items.map(([l, n]) => tile(l, n)).join('')}</div>
      <p class="status">학급·실별 합계 ${used}대</p></div>`;
  }).join('')}</div>`;
}

const REF_VIEWS = { '기기 대장': viewDevices, '필수 연수': viewTraining, '교육과정 편제': viewCurriculum, '행사 일정': viewEvents, '내선번호': viewExtension, '특별실 시간표': viewRooms, '학사일정': viewAcademic };

async function unlock(code, silent) {

const urlB64 = s => { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); };
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function renderAlarm() {

    <label class="toggle"><input type="checkbox" id="aboard" ${alarm.board !== false ? 'checked' : ''}><span>수합·공지 알림<small>담당 선생님이 [알림 보내기]를 누를 때만 옵니다. 수합은 우리 반이 아직 체크하지 않았을 때만 옵니다.</small></span></label>

    </div>
    <div id="amsg">${DEMO ? '<p class="msg">미리보기에서는 알림을 켤 수 없습니다. 학교 사이트에서 켜 주세요.</p>' : ''}
      ${!DEMO && isIOS && !standalone ? '<p class="msg">아이폰은 먼저 Safari 공유 버튼 → <b>홈 화면에 추가</b>로 앱을 설치한 뒤, 홈 화면 아이콘으로 열어야 알림을 켤 수 있습니다.</p>' : ''}
      ${!DEMO && !can && !isIOS ? '<p class="msg err">이 브라우저는 알림을 지원하지 않습니다. 크롬이나 삼성 인터넷에서 열어 주세요.</p>' : ''}</div>
  </div>

const amsg = (t, err) => { $('#amsg').innerHTML = `<p class="msg${err ? ' err' : ''}">${t}</p>`; };
async function saveAlarm() {
  alarm.daily = $('#adaily').checked; alarm.weekly = $('#aweekly').checked; alarm.board = $('#aboard').checked;
  if (!alarm.groups.length) return amsg('학년을 하나 이상 골라 주세요.', true);
  try {
    const reg = await navigator.serviceWorker.ready;
    if (Notification.permission !== 'granted' && (await Notification.requestPermission()) !== 'granted') return amsg('알림 권한이 꺼져 있습니다. 브라우저 설정에서 이 사이트의 알림을 허용해 주세요.', true);
    let sub = await reg.pushManager.getSubscription();
    if (!sub) { const key = await (await fetch('/api/vapid')).text(); sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(key.trim()) }); }
    const res = await fetch('/api/subscribe', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(subBody(sub)) });
    if (!res.ok) throw new Error((await res.json()).error);
    alarm.on = true; LS.set('alarm', alarm); renderAlarm();
    amsg('저장했습니다. 고른 학년: ' + alarm.groups.map(g => GROUPS.find(x => x.id === g).label).join(', '));
  } catch (e) { amsg('알림을 켜지 못했습니다. ' + esc(e.message), true); }
}
$('#view').addEventListener('click', async e => {
  const g = e.target.closest('[data-ag]');
  if (g) { const id = g.dataset.ag; alarm.groups = alarm.groups.includes(id) ? alarm.groups.filter(x => x !== id) : [...alarm.groups, id]; g.setAttribute('aria-pressed', alarm.groups.includes(id)); LS.set('alarm', alarm); }
  if (e.target.id === 'aon') saveAlarm();
  if (e.target.id === 'atest') {
    const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription();

    amsg(res.ok ? '보냈습니다. 몇 초 안에 알림이 옵니다.' : esc((await res.json()).error), !res.ok);

  }
});

/* ---------- 검색 ---------- */
let VOCAB = [];
const norm = s => String(s).toLowerCase().replace(/\s+/g, '');
function allTables() { return [...(DATA?.tables || []), ...(SECURE?.tables || []).map(t => ({ ...t, secure: true }))]; }
function buildVocab() {
  const m = new Map();
  const add = (w, kind) => { w = w.trim(); if (w.length < 2 || w.length > 30 || /^[\d\s.\-:~()]+$/.test(w)) return; const k = norm(w); if (!m.has(k)) m.set(k, { w, kind, n: 0 }); m.get(k).n++; };
  EVENTS.forEach(e => { add(e.text.split(/[(\[]/)[0], '일정'); e.owner.split(/[,\n]/).forEach(o => add(o.replace(/\(.*\)/, ''), '담당')); });
  allTables().forEach(t => t.rows.forEach(r => r.forEach(c => String(c).split('\n').forEach(x => { if (x.trim().length <= 20) add(x, t.name); }))));
  (DATA?.links || []).forEach(l => add(l.title, '링크'));
  VOCAB = [...m.values()];
}
let sIdx = -1;
function renderSuggest() {
  const q = norm($('#q').value), box = $('#suggest');
  if (!q) { box.hidden = true; return; }
  const list = VOCAB.filter(v => norm(v.w).includes(q) && norm(v.w) !== q)
    .sort((a, b) => (norm(a.w).startsWith(q) ? 0 : 1) - (norm(b.w).startsWith(q) ? 0 : 1) || b.n - a.n).slice(0, 7);
  sIdx = -1;
  box.hidden = !list.length;
  box.innerHTML = list.map(v => `<button type="button" data-s="${esc(v.w)}">${hl(v.w, $('#q').value.trim())}<em>${esc(v.kind)}</em></button>`).join('');
}
function setQ(v) { $('#q').value = v; st.q = v.trim(); $('#qclear').hidden = !v; $('#suggest').hidden = true; render(); }

function renderSearch() {
  const raw = st.q, words = raw.split(/\s+/).filter(Boolean).map(norm);
  const ok = s => { const n = norm(s); return words.every(w => n.includes(w)); };
  const ev = EVENTS.filter(e => visible(e) && ok(e.text + ' ' + e.owner + ' ' + fmtDate(e.date)));
  const up = ev.filter(e => e.date >= TODAY), past = ev.filter(e => e.date < TODAY).reverse();
  const rows = [];
  allTables().forEach(t => t.rows.forEach(r => {
    let cells = r.map(c => String(c).trim()).filter(Boolean);
    if (!cells.length || !ok(cells.join(' '))) return;
    // 줄 전체가 길면 검색어가 든 칸과 줄 머리(첫 칸)만 보여 줌

    ${past.length ? `<div class="sec"><h2>지난 일정 <small>${past.length}</small></h2>${past.slice(0, 40).map(hitEv).join('')}</div>` : ''}
    ${!total ? `<p class="empty">찾는 내용이 없습니다.${st.filter.length ? ' 위에서 <b>전체</b>를 눌러 모든 학년에서 찾아보세요.' : ''}${!SECURE && !DEMO ? ' 비밀번호·연락처는 보안 탭을 연 뒤 검색됩니다.' : ''}</p>` : ''}`;
}

const addDays = n => { const d = new Date(today); d.setDate(d.getDate() + n); return ymd(d); };
const dueInfo = d => {

  if (diff < 0) return ['late', `마감 지남 ${m}.${dd}`];
  if (diff === 0) return ['soon', '오늘 마감'];
  if (diff === 1) return ['soon', '내일 마감'];

};

async function api(path, body) {
  if (DEMO) return demoApi(path, body);
  const res = await fetch('/api/' + path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(d.error || ('오류 ' + res.status));
  return d;
}
function demoApi(path, b) {
  const B = DEMO_BOARD; B.classes = classesFrom(DATA);
  const id = 'd' + Date.now().toString(36);
  if (path === 'board') return JSON.parse(JSON.stringify(B));
  if (path === 'collect') { B.items.push({ ...b, id, done: {}, createdAt: new Date().toISOString(), mineDemo: true }); return { id, token: 'demo' }; }
  if (path === 'notice') { B.notices.unshift({ ...b, id, createdAt: new Date().toISOString(), mineDemo: true }); return { id, token: 'demo' }; }
  if (path === 'collect/check') { const it = B.items.find(x => x.id === b.id); if (b.done) it.done[b.cls] = new Date().toISOString(); else delete it.done[b.cls]; return {}; }
  if (path.endsWith('/delete')) { B.items = B.items.filter(x => x.id !== b.id); B.notices = B.notices.filter(x => x.id !== b.id); return {}; }
  if (path.endsWith('/push')) return { demo: true };
  return {};
}

    try {
      const r = await api(kind + '/push', { id, token: tokens[id], code: LS.get('code', null) });
      ui.msg[id] = { t: r.demo ? '미리보기에서는 알림이 가지 않습니다.' : `알림을 보냈습니다. 받은 기기 ${r.sent}대${kind === 'collect' ? ` · 체크 안 한 반 ${r.left}개` : ''}${r.sent ? '' : ' (알림을 켠 선생님이 아직 없습니다)'}` };
    } catch (err) { ui.msg[id] = { t: err.message, err: 1 }; }
    await loadBoard(true); return;
  }
  if (t.dataset.askdel) { ui.confirm = t.dataset.askdel; render(); return; }
  if (t.dataset.cancel !== undefined) { ui.confirm = ''; render(); return; }
  if (t.dataset.del) {
    const [kind, id] = t.dataset.del.split('|'); ui.confirm = '';
    try { await api(kind + '/delete', { id, token: tokens[id], code: LS.get('code', null) }); } catch (err) { ui.msg[id] = { t: err.message, err: 1 }; }
    await loadBoard(true);
  }
});
$('#view').addEventListener('submit', async e => {
  if (e.target.id === 'cform') {
    e.preventDefault();
    const body = { title: $('#ctitle').value.trim(), due: $('#cdue').value, body: $('#cbody').value.trim(), link: $('#clink').value.trim(), by: $('#cby').value.trim(), grades: ui.cgrades || [] };
    if (!body.title) return;
    LS.set('by', body.by);
    try { const r = await api('collect', body); tokens[r.id] = r.token; LS.set('tokens', tokens); ui.cform = false; ui.draft = null; ui.msg[r.id] = { t: '올렸습니다. 선생님들께 휴대폰 알림을 보내려면 [알림] 버튼을 누르세요.' }; await loadBoard(true); }
    catch (err) { $('#cmsg').innerHTML = `<p class="msg err">${esc(err.message)}</p>`; }
  }
  if (e.target.id === 'nform') {
    e.preventDefault();
    const body = { title: $('#ntitle').value.trim(), date: $('#ndate').value, body: $('#nbody').value.trim(), link: $('#nlink').value.trim(), by: $('#nby').value.trim() };
    if (!body.title) return;
    LS.set('by', body.by);
    try { const r = await api('notice', body); tokens[r.id] = r.token; LS.set('tokens', tokens); ui.nform = false; ui.draft = null; ui.msg[r.id] = { t: '올렸습니다. 휴대폰 알림은 [알림 보내기]를 누르면 갑니다.' }; await loadBoard(true); }
    catch (err) { $('#nmsg').innerHTML = `<p class="msg err">${esc(err.message)}</p>`; }
  }
});


/* ---------- 쿨메신저 캡처 → 초안 (Gemini) ---------- */
const dr = () => ui.draft || {};
function aiZone() {
  return `<div class="drop${ui.ai === 'busy' ? ' busy' : ''}" id="drop">
    <div class="ico">AI</div>
    <div class="txt"><b>${ui.ai === 'busy' ? '캡처를 읽는 중…' : '쿨메신저 캡처로 바로 만들기'}</b>
      <span>${ui.ai && ui.ai !== 'busy' ? esc(ui.ai) : '캡처 이미지를 여기로 끌어다 놓거나 붙여넣기(Ctrl+V) 하면 수합인지 공지인지 판단해 칸을 채워 줍니다.'}</span></div>
    <label class="btn ghost sm" for="aifile">사진 고르기</label><input type="file" id="aifile" accept="image/*">
  </div>`;
}
function aiBanner(kind) {
  if (!ui.draft || !ui.draft.fromAI) return '';
  const other = kind === 'collect' ? 'notice' : 'collect';
  return `<div class="aibanner">캡처에서 읽은 내용입니다. 확인하고 고친 뒤 올려 주세요.<button type="button" class="linkish" data-aiswitch="${other}">${other === 'notice' ? '공지로' : '수합으로'} 바꾸기</button></div>`;
}
// 휴대폰 사진도 가볍게 — 긴 변 1600px JPEG로 줄여서 보냄
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 열지 못했습니다.')); };
    img.src = url;
  });
}
async function readCapture(file) {
  if (!file || !/^image\//.test(file.type)) { ui.ai = '이미지 파일만 넣을 수 있습니다.'; return render(); }
  if (DEMO) { ui.ai = '미리보기에서는 AI 읽기가 동작하지 않습니다. 학교 사이트에서 써 주세요.'; return render(); }
  ui.ai = 'busy'; render();
  try {
    const image = await shrink(file);
    const r = await api('ai/read', { image, mime: 'image/jpeg', today: TODAY });
    ui.ai = ''; ui.draft = { ...r, fromAI: true };
    st.tab = r.kind; ui.cform = r.kind === 'collect'; ui.nform = r.kind === 'notice'; ui.cgrades = r.grades || [];
    render(); window.scrollTo(0, 0);
  } catch (e) { ui.ai = e.message; render(); }
}
$('#view').addEventListener('change', e => { if (e.target.id === 'aifile' && e.target.files[0]) readCapture(e.target.files[0]); });
$('#view').addEventListener('dragover', e => { const d = e.target.closest('#drop') || (['collect', 'notice'].includes(st.tab) && $('#drop')); if (d && e.dataTransfer.types.includes('Files')) { e.preventDefault(); d.classList.add('over'); } });
$('#view').addEventListener('dragleave', e => { const d = e.target.closest('#drop'); if (d) d.classList.remove('over'); });
$('#view').addEventListener('drop', e => { if (!['collect', 'notice'].includes(st.tab) || !e.dataTransfer.files.length) return; e.preventDefault(); readCapture(e.dataTransfer.files[0]); });
document.addEventListener('paste', e => {
  if (!['collect', 'notice'].includes(st.tab) || st.q) return;
  const f = [...(e.clipboardData?.files || [])].find(x => /^image\//.test(x.type));
  if (f) { e.preventDefault(); readCapture(f); }
});
$('#view').addEventListener('click', e => {
  const b = e.target.closest('[data-aiswitch]'); if (!b) return;
  const k = b.dataset.aiswitch;
  const cur = st.tab === 'collect'
    ? { title: $('#ctitle').value, due: $('#cdue').value, by: $('#cby').value, link: $('#clink').value, body: $('#cbody').value }
    : { title: $('#ntitle').value, date: $('#ndate').value, by: $('#nby').value, link: $('#nlink').value, body: $('#nbody').value };
  ui.draft = { ...ui.draft, ...cur, kind: k, due: cur.due || ui.draft.due || cur.date, date: cur.date || ui.draft.date || TODAY };
  st.tab = k; ui.cform = k === 'collect'; ui.nform = k === 'notice'; ui.cgrades = ui.draft.grades || [];
  render();
});

  renderTabs();
  if (!DATA) return;
  if (st.q) return renderSearch();
  ({ sched: renderSched, collect: renderCollect, notice: renderNotice, ref: renderRef, lock: renderLock, alarm: renderAlarm })[st.tab]();
}
renderFilter(); renderTabs();

if (!DEMO && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
