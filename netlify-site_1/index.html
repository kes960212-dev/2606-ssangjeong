<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#e3d6c0">
<title>6학년 운영 데스크</title>
<script src="config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="6학년 데스크">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/* ── 종이 다이어리 테마 ── */
:root{
  color-scheme: light;
  --desk:#e3d6c0; --paper:#fdfaf3; --paper-2:#f6f0e3; --paper-3:#efe7d6;
  --rule:#e9e0cf; --rule-strong:#d9ccb5; --ink:#34302a; --ink-soft:#857c6e;
  --pen-red:#d9474f; --pen-blue:#3d62b3; --pen-green:#2e9a6a; --pen-amber:#c98a1f;
  --hl-yellow:rgba(255,223,80,.55); --hl-mint:rgba(120,214,190,.42); --hl-pink:rgba(255,158,178,.38);
  --postit:#fff4a3; --postit-pink:#ffdfe4; --postit-mint:#dff5ea; --postit-blue:#dceafc;
  --shadow:0 18px 40px rgba(80,55,20,.22);
  --hand:"Gaegu","Apple SD Gothic Neo","Malgun Gothic",cursive;
  --pen:"Nanum Pen Script","Gaegu",cursive;
  --ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--ui);color:var(--ink);background-color:var(--desk);
  background-image:repeating-linear-gradient(93deg, rgba(120,85,40,.035) 0 2px, transparent 2px 11px),
    radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.35), transparent 60%);
  background-attachment:fixed;min-height:100vh;font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pen-blue)}
.hidden{display:none!important}
.muted{color:var(--ink-soft)}
.small{font-size:.8rem}
.hl{background:linear-gradient(transparent 55%, var(--hl-yellow) 55%, var(--hl-yellow) 92%, transparent 92%)}
::selection{background:var(--hl-yellow)}

/* 버튼 */
.btn{background:var(--ink);color:var(--paper);border:none;padding:8px 18px;border-radius:10px;
  font-family:var(--hand);font-size:1.08rem;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{background:#4a453d}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.line{background:var(--paper);color:var(--ink);border:1.5px solid var(--rule-strong)}
.btn.line:hover{background:var(--paper-2);border-color:var(--ink-soft)}
.btn.sm{padding:4px 12px;font-size:1rem}
.btn.danger{color:var(--pen-red)}

/* 상단 */
.topbar{max-width:1240px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 20px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-family:var(--pen);font-weight:400;font-size:2.2rem;margin:0;letter-spacing:-.5px;line-height:1.1}
.topbar .sub{font-size:.72rem;color:var(--ink-soft);letter-spacing:.04em}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#gq{width:210px;padding:6px 10px;border:none;border-bottom:2px solid var(--rule-strong);background:transparent;
  font-family:var(--hand);font-size:1.12rem}
#gq:focus{outline:none;border-bottom-color:var(--pen-blue)}
.status{font-size:.7rem;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.5);color:var(--ink-soft);white-space:nowrap}

/* 책갈피 탭 */
.tabsbar{max-width:1240px;margin:0 auto;padding:10px 20px 0;display:flex;gap:4px;overflow-x:auto}
.tabsbar button{border:none;font-family:var(--hand);font-size:1.12rem;font-weight:700;padding:8px 16px 10px;
  border-radius:10px 10px 0 0;background:rgba(255,255,255,.45);color:var(--ink-soft);white-space:nowrap}
.tabsbar button.on{background:var(--paper);color:var(--ink);box-shadow:0 -2px 8px rgba(80,55,20,.08)}
.tabsbar button .n{font-size:.78rem;color:var(--pen-red)}

/* 종이 */
main{max-width:1240px;margin:0 auto;padding:16px 20px 56px}
.sheet{position:relative;background:var(--paper);border-radius:6px;box-shadow:var(--shadow);padding:24px 26px 28px;margin-bottom:22px}
.sheet::before,.sheet::after{content:"";position:absolute;inset:4px -4px -5px 4px;background:var(--paper-2);border-radius:6px;z-index:-1;box-shadow:0 2px 6px rgba(80,55,20,.12)}
.sheet::after{inset:8px -8px -10px 8px;background:var(--paper-3);z-index:-2}
.sheet.plain{box-shadow:0 6px 18px rgba(80,55,20,.15)}
.sheet.plain::before,.sheet.plain::after{display:none}
.tape{position:absolute;top:-11px;left:44px;width:118px;height:22px;transform:rotate(-3deg);
  background:rgba(150,200,225,.6);clip-path:polygon(0 12%,5% 0,95% 10%,100% 0,98% 50%,100% 100%,94% 90%,6% 100%,0 88%,2% 50%)}
.tape.yellow{background:rgba(255,223,80,.66)} .tape.pink{background:rgba(255,158,178,.55)}
.saving{font-family:var(--ui);font-size:.66rem;color:var(--pen-amber);background:rgba(201,138,31,.14);
  border-radius:999px;padding:2px 8px;white-space:nowrap}
.note.pending{opacity:.8;box-shadow:none;outline:2px dashed var(--rule-strong);outline-offset:-3px}
.status.wait{color:var(--pen-amber);font-weight:700}
/* 전담 배치 */
.tt.spec td .homeroom{color:var(--rule-strong);font-size:.85rem;font-family:var(--ui)}
.tt.week td{vertical-align:top;padding:7px 4px}
.tt.week .sj{display:inline-block;margin:1px 2px;font-size:.92rem}
.tt.week th.td-today,.tt.week td.td-today{background:rgba(255,223,80,.16)}
.chip.off{opacity:.45}
.daynotes{margin-top:10px;display:flex;flex-direction:column;gap:3px}
.note-line{font-family:var(--hand);font-size:1.02rem;color:var(--pen-blue)}
.note-line::before{content:"✎ ";opacity:.7}
.freerow{margin-top:10px;font-family:var(--hand);font-size:1.06rem;color:var(--pen-green);
  background:var(--hl-mint);display:inline-block;padding:3px 12px;border-radius:999px}
/* 이번 주 중요 일정 띠 */
.banner{max-width:1240px;margin:8px auto -4px;padding:9px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--postit);border-radius:8px;box-shadow:0 4px 14px rgba(80,55,20,.16);
  transform:rotate(-.25deg);position:relative;z-index:2}
.banner .bt{font-family:var(--hand);font-weight:700;font-size:1.05rem;background:var(--ink);color:var(--paper);
  padding:2px 11px;border-radius:999px;white-space:nowrap}
.banner .bi{font-family:var(--hand);font-size:1.08rem}
.banner .bi b{font-weight:700;color:var(--pen-red)}
.banner .bi.now{text-decoration:underline;text-decoration-color:var(--pen-red);text-underline-offset:3px}
.banner .bmore{margin-left:auto;border:none;background:rgba(0,0,0,.08);font-family:var(--ui);font-size:.74rem;
  padding:4px 11px;border-radius:999px;white-space:nowrap}

/* 달력 */
.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-family:var(--ui);font-size:.76rem;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;
  padding:0 0 7px;border-bottom:1.5px solid var(--ink)}
.cal th.sun,.cal td.sun .dnum{color:var(--pen-red)}
.cal th.sat,.cal td.sat .dnum{color:var(--pen-blue)}
.cal td{border-bottom:1px solid var(--rule);border-right:1px dashed var(--rule);vertical-align:top;
  height:92px;padding:5px 5px 7px;cursor:pointer}
.cal td:last-child{border-right:none}
.cal td.blank{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.02) 6px 12px);cursor:default}
.cal td:hover:not(.blank){background:var(--paper-2)}
.cal td.is-today .dnum{background:var(--pen-red);color:#fff;border-radius:50%;
  width:1.55em;height:1.55em;display:inline-flex;align-items:center;justify-content:center}
.cal td.is-pick{background:var(--hl-yellow)}
.cal td.is-pick:hover{background:var(--hl-yellow)}
.cal .dnum{font-family:var(--serif);font-size:1.05rem;line-height:1.5em;margin-bottom:3px}
.cal .cev{font-family:var(--hand);font-size:.95rem;line-height:1.25;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .cev.star{color:var(--pen-red);font-weight:700}
.cal .cev.pend{opacity:.55}
.cal .cdue{font-family:var(--ui);font-size:.66rem;color:var(--pen-amber);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .cspec{font-family:var(--ui);font-size:.62rem;color:var(--ink-soft);margin-top:3px}
.cal .cmore{font-family:var(--ui);font-size:.64rem;color:var(--ink-soft)}
.chip.star-toggle.on{background:var(--postit);color:var(--pen-red);font-weight:700}
@media (max-width: 720px){
  .cal td{height:78px;padding:3px 2px}
  .cal .dnum{font-size:.95rem;margin-bottom:1px}
  .cal .cev{font-size:.76rem;white-space:normal;line-height:1.14;max-height:2.3em;overflow:hidden}
  .cal .cdue,.cal .cspec,.cal .cmore{display:none}
}
.title{font-family:var(--pen);font-weight:400;font-size:1.7rem;margin:0 0 10px;line-height:1.2;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.title .more{margin-left:auto;font-family:var(--ui);font-size:.74rem;color:var(--ink-soft)}
.title b{font-weight:400}
.title .mark{background:linear-gradient(transparent 58%, var(--hl-mint) 58%, var(--hl-mint) 92%, transparent 92%)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.rule{border:0;border-top:1.5px solid var(--ink);margin:10px 0 12px}
.empty{color:var(--rule-strong);font-family:var(--hand);font-size:1.1rem;padding:10px 0}

/* 마스킹테이프 칩 */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{--c:#9a917f;border:none;padding:4px 13px 5px;font-family:var(--hand);font-size:1.02rem;font-weight:700;color:var(--ink);
  background:color-mix(in srgb, var(--c) 16%, var(--paper));
  clip-path:polygon(0 10%,4% 0,96% 8%,100% 0,98% 50%,100% 100%,95% 92%,5% 100%,0 90%,2% 50%);transition:transform .12s, background .12s}
.chip:hover{background:color-mix(in srgb, var(--c) 30%, var(--paper))}
.chip.on{background:color-mix(in srgb, var(--c) 55%, var(--paper));transform:rotate(-2deg) scale(1.05)}
.chip.red{--c:var(--pen-red)} .chip.blue{--c:var(--pen-blue)} .chip.green{--c:var(--pen-green)} .chip.amber{--c:var(--pen-amber)}

/* 오늘 머리 */
.dayhead{display:flex;align-items:flex-end;gap:14px;padding-bottom:8px;border-bottom:1.5px solid var(--ink);flex-wrap:wrap}
.big-day{font-family:var(--serif);font-size:3.6rem;line-height:.9}
.dow-box{display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.dow{font-size:.76rem;letter-spacing:.3em;font-weight:700}
.md{font-family:var(--hand);font-size:1.05rem;color:var(--ink-soft)}
.nowbox{margin-left:auto;text-align:right;padding-bottom:2px}
.nowbox .state{font-family:var(--hand);font-size:1.3rem;font-weight:700;color:var(--pen-green)}
.nowbox .clock{font-family:var(--serif);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{flex:1;min-width:110px;border:1.5px dashed var(--rule-strong);border-radius:10px;padding:8px 12px}
.stat small{display:block;color:var(--ink-soft);font-size:.72rem}
.stat b{font-family:var(--hand);font-size:1.6rem;font-weight:700;line-height:1.2}
.stat.warn{border-color:var(--pen-red);border-style:solid;background:rgba(217,71,79,.06)}
.stat.warn b{color:var(--pen-red)}

/* 시간표 */
.tt{width:100%;border-collapse:collapse;table-layout:fixed;font-family:var(--hand);font-size:1.08rem}
.tt th,.tt td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:7px 4px;text-align:center}
.tt tr th:last-child,.tt tr td:last-child{border-right:none}
.tt thead th{border-bottom:1.5px solid var(--ink);font-family:var(--ui);font-size:.78rem;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;padding-bottom:6px}
.tt td.pcol,.tt th.pcol{width:78px;text-align:left;font-family:var(--ui);font-size:.7rem;color:var(--ink-soft);line-height:1.3}
.tt td b{font-weight:700}
.tt tr.nowrow{background:rgba(255,223,80,.24)}
.tt tr.nowrow td.pcol{color:var(--ink);font-weight:700}
.sj{display:inline-block;padding:0 6px;border-radius:4px}
.sj-국어{background:var(--hl-mint)} .sj-수학{background:rgba(255,223,80,.5)} .sj-사회{background:rgba(255,190,120,.4)}
.sj-과학{background:rgba(160,190,255,.4)} .sj-영어{background:var(--hl-pink)} .sj-체육{background:rgba(120,214,190,.35)}
.sj-음악{background:rgba(255,206,140,.4)} .sj-미술{background:rgba(205,180,255,.35)} .sj-실과{background:rgba(190,230,190,.4)}
.sj-도덕{background:rgba(255,190,190,.35)} .sj-창체{background:rgba(220,210,190,.6)}

/* 수합 */
.item{position:relative;padding:12px 4px 12px 2px;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:none}
.item .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.item .name{font-family:var(--hand);font-size:1.28rem;font-weight:700}
.item.done .name{text-decoration:line-through;text-decoration-color:var(--pen-red);opacity:.6}
.due{font-family:var(--ui);font-size:.72rem;padding:2px 9px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft);white-space:nowrap}
.due.late{background:rgba(217,71,79,.14);color:var(--pen-red);font-weight:700}
.due.soon{background:rgba(201,138,31,.16);color:var(--pen-amber);font-weight:700}
.due.ok{background:rgba(46,154,106,.14);color:var(--pen-green)}
.item .acts{margin-left:auto;display:flex;gap:6px}
.cls-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:9px;max-width:470px}
.cls{border:none;background:transparent;font-family:var(--hand);font-size:1.05rem;font-weight:700;
  color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px}
.cls .mark{width:34px;height:34px;line-height:32px;border-radius:50%;border:2px dashed var(--rule-strong);font-size:1rem;text-align:center;color:var(--rule-strong)}
.cls.yes{color:var(--ink)}
.cls.yes .mark{border:2px solid var(--pen-red);border-radius:48% 52% 45% 55% / 55% 45% 55% 45%;transform:rotate(-8deg);color:var(--pen-red)}
.cls.busy{opacity:.45}
.progress{height:9px;border-radius:999px;background:var(--paper-2);border:1px solid var(--rule);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--pen-green) 0 7px,#37b07c 7px 14px)}
.formrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.formrow .f{flex:1;min-width:130px}
.formrow label{display:block;font-size:.72rem;color:var(--ink-soft);margin-bottom:2px}
.formrow input,.formrow select,.formrow textarea{width:100%;padding:5px 4px;border:none;border-bottom:2px solid var(--rule-strong);
  background:transparent;font-family:var(--hand);font-size:1.15rem}
.formrow input:focus,.formrow textarea:focus,.formrow select:focus{outline:none;border-bottom-color:var(--pen-blue)}
textarea{font-family:var(--hand);font-size:1.12rem;border:1.5px solid var(--rule-strong);border-radius:8px;background:var(--paper);padding:8px 10px;width:100%}

/* 일정 목록 */
.ev{display:flex;gap:12px;padding:8px 2px;border-bottom:1px solid var(--rule);align-items:baseline;font-family:var(--hand);font-size:1.12rem}
.ev:last-child{border-bottom:none}
.ev .when{min-width:96px;color:var(--ink-soft);font-size:1rem;flex-shrink:0}
.ev .dot{width:8px;height:8px;border-radius:50%;background:var(--pen-blue);display:inline-block;margin-right:6px}
.ev .x{margin-left:auto;border:none;background:transparent;color:var(--rule-strong);font-size:1rem}
.ev .x:hover{color:var(--pen-red)}

/* 포스트잇 */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.note{position:relative;background:var(--postit);padding:16px 14px 30px;border-radius:2px;min-height:130px;
  box-shadow:0 6px 14px rgba(80,55,20,.18);font-family:var(--hand);font-size:1.15rem;white-space:pre-wrap;word-break:break-word;
  transform:rotate(var(--rot,-1deg))}
.note.pink{background:var(--postit-pink)} .note.mint{background:var(--postit-mint)} .note.blue{background:var(--postit-blue)}
.note .who{position:absolute;bottom:8px;left:14px;font-size:.72rem;font-family:var(--ui);color:rgba(52,48,42,.55)}
.note .x{position:absolute;top:6px;right:8px;border:none;background:transparent;color:rgba(52,48,42,.35);font-size:1rem}
.note .x:hover{color:var(--pen-red)}

/* 목록·표 */
.list{width:100%;border-collapse:collapse;font-family:var(--hand);font-size:1.1rem}
.list th{font-family:var(--ui);font-size:.72rem;letter-spacing:.06em;color:var(--ink-soft);text-align:left;padding:4px 6px;border-bottom:1.5px solid var(--ink)}
.list td{padding:7px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
.list tr:hover td{background:rgba(255,223,80,.12)}
.list td.num,.list th.num{font-variant-numeric:tabular-nums;text-align:right}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.person{border-bottom:1px solid var(--rule);padding:7px 4px;font-family:var(--hand);font-size:1.12rem}
.person small{display:block;font-family:var(--ui);font-size:.7rem;color:var(--ink-soft)}
.badge{display:inline-block;font-family:var(--ui);font-size:.66rem;padding:1px 7px;border-radius:999px;background:var(--hl-yellow);color:#6b4e00;margin-top:3px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-family:var(--hand);font-size:1.05rem;font-weight:700;text-decoration:none;color:var(--ink);
  background:rgba(150,200,225,.28);padding:3px 12px 4px;
  clip-path:polygon(0 10%,4% 0,96% 8%,100% 0,98% 50%,100% 100%,95% 92%,5% 100%,0 90%,2% 50%)}
.links a:hover{background:rgba(150,200,225,.5)}
.tablewrap{overflow:auto;max-height:64vh;border:1.5px solid var(--rule-strong);border-radius:8px;background:var(--paper)}
table.sheetview{border-collapse:collapse;font-size:.82rem;min-width:100%;font-family:var(--ui)}
table.sheetview td{border:1px solid var(--rule);padding:5px 8px;vertical-align:top;white-space:pre-line;max-width:340px}
table.sheetview tr.hit td{background:var(--hl-yellow)}
.eval{border-left:3px solid var(--rule-strong);padding:6px 0 6px 12px;margin-bottom:10px}
.eval b{font-family:var(--hand);font-size:1.18rem}
.weekgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.weekcol{border:1px solid var(--rule);border-radius:8px;padding:8px;min-height:130px;background:var(--paper)}
.weekcol h4{margin:0 0 6px;font-family:var(--hand);font-size:1.1rem;border-bottom:1px solid var(--rule);padding-bottom:4px}
.weekcol.today{background:rgba(255,223,80,.16);border-color:var(--pen-amber)}
.weekcol ul{margin:0;padding-left:16px;font-family:var(--hand);font-size:1.02rem}
.weekcol li{margin-bottom:3px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:9px 16px;border-radius:10px;font-family:var(--hand);font-size:1.1rem;z-index:60;max-width:90vw;box-shadow:var(--shadow)}
.skel{display:flex;flex-direction:column;gap:10px}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--paper-2) 25%,var(--paper) 50%,var(--paper-2) 75%);background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.preview{position:fixed;right:10px;bottom:10px;background:var(--ink);color:var(--paper);font-size:.7rem;padding:4px 10px;border-radius:8px;opacity:.8;z-index:50}

/* 로그인(코드가 있을 때만) */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{position:relative;width:100%;max-width:340px;background:var(--paper);border-radius:4px;padding:34px 26px 28px;box-shadow:var(--shadow);text-align:center}
.login-card h1{font-family:var(--pen);font-size:2rem;margin:0 0 4px;font-weight:400}
.login-card p{color:var(--ink-soft);font-size:.8rem;margin:0 0 20px}
.login-card input{width:100%;padding:8px 4px;border:none;border-bottom:2px solid var(--rule-strong);background:transparent;
  font-family:var(--hand);font-size:1.3rem;text-align:center;margin-bottom:16px}
.login-card input:focus{outline:none;border-bottom-color:var(--pen-blue)}
.err{color:var(--pen-red);font-family:var(--hand);font-size:1.05rem;min-height:22px}

@media (max-width: 900px){ .grid2{grid-template-columns:1fr} .weekgrid{grid-template-columns:1fr} }
@media (max-width: 600px){
  main{padding:0 12px 48px}
  .sheet{padding:20px 16px 24px}
  .topbar{padding:12px 14px 0}
  .topbar h1{font-size:1.85rem}
  #gq{width:100%;order:3}
  .top-actions{width:100%;margin-left:0}
  .tabsbar{padding:10px 12px 0}
  .big-day{font-size:2.8rem}
  .stats{gap:8px}
  .stat{min-width:calc(50% - 4px)}
}
@media print{
  body{background:#fff}
  .topbar,.tabsbar,.top-actions,.btn,.chips,.preview{display:none!important}
  .sheet{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .sheet::before,.sheet::after{display:none}
}
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <div class="tape yellow"></div>
    <h1>6학년 운영 데스크</h1>
    <p>학년에서 공유한 접속코드를 적어 주세요</p>
    <input id="code" type="password" required autocomplete="current-password" placeholder="접속코드" autofocus>
    <button class="btn" style="width:100%;justify-content:center" id="loginBtn" type="submit">펼치기</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<div id="app" class="hidden">
  <header class="topbar">
    <div><h1 id="title">6학년 운영 데스크</h1><div class="sub" id="subtitle"></div></div>
    <div class="top-actions">
      <input id="gq" type="search" placeholder="🔍 전체 검색 (이름·수합·과목…)" autocomplete="off">
      <span class="status" id="status"></span>
      <button class="btn line sm" id="sheetBtn" type="button">시트 열기</button>
      <button class="btn line sm hidden" id="logoutBtn" type="button">나가기</button>
    </div>
  </header>
  <div class="banner hidden" id="banner"></div>
  <nav class="tabsbar" id="tabs"></nav>
  <main><div id="view"></div></main>
</div>

<script>
(function(){
'use strict';
var SITE = window.SITE_CONFIG || {};
var API = SITE.API_URL || '';
var MODE = API ? 'api' : (window.google && google.script && google.script.run) ? 'gas' : 'preview';
var S = { token:null, d:null, page:'today', day:null, cls:null, filter:'todo', subject:null, tab:null, q:'',
  timers:[], showSupport:false, weekOff:0, recEvent:'', busy:false };

/* ───── 통신 ───── */
function call(action, p){
  p = p || {}; p.token = S.token;
  return new Promise(function(res, rej){
    if (MODE === 'preview'){ setTimeout(function(){ try{ res(MOCK(action,p)); }catch(e){ rej(e); } }, 150); return; }
    function done(r){
      if (!r) return rej(new Error('응답이 없습니다.'));
      if (!r.ok) return rej(new Error(r.error));
      res(r.data);
    }
    if (MODE === 'api'){
      var body = { action: action }; for (var k in p) body[k] = p[k];
      fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) })
        .then(function(r){ return r.json(); }).then(done)
        .catch(function(){ rej(new Error('서버에 연결하지 못했어요.')); });
      return;
    }
    google.script.run.withSuccessHandler(done).withFailureHandler(rej).api(action, p);
  });
}
function box(){ try{ return localStorage.getItem('g6_keep')==='1' ? localStorage : sessionStorage; }catch(e){ return null; } }
function lsGet(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)||'null'); return v==null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ───── 유틸 ───── */
function $(id){ return document.getElementById(id); }
function won(v){ var n=Number(String(v==null?'':v).replace(/[^0-9.-]/g,'')); return n ? n.toLocaleString('ko-KR') : String(v==null?'':v); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function each(l,f){ Array.prototype.forEach.call(l,f); }
var WD = ['일','월','화','수','목','금','토'];
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function today(){ return ymd(new Date()); }
function dday(s){ return Math.round((parseYmd(s)-parseYmd(today()))/86400000); }
function hm(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function md(s){ var d=parseYmd(s); return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'; }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){ t.remove(); },2800); }
function skel(n){ var h='<div class="skel">'; for(var i=0;i<(n||5);i++) h+='<div class="sk" style="width:'+(55+(i*29)%40)+'%"></div>'; return h+'</div>'; }
function copyText(text){
  function fb(){ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity=0;
    document.body.appendChild(ta); ta.select(); var ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove();
    if(!ok) window.prompt('복사하세요 (Ctrl+C)', text); return Promise.resolve(); }
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).catch(fb);
  return fb();
}
function myName(){ return lsGet('g6_me',''); }
function askName(force){
  var v = window.prompt('기록에 남길 이름을 적어 주세요. (예: 김은서)', myName());
  if (v==null) return myName();
  v = v.trim(); lsSet('g6_me', v); return v;
}
function needName(){ return myName() || askName(); }
function act(action, payload, okMsg){
  if (S.busy) return Promise.reject(new Error('처리 중이에요.'));
  S.busy = true; setStatus('저장 중…');
  payload = payload || {}; payload.who = myName();
  return call(action, payload).then(function(){
    return call('data').then(function(d){ S.d = d; go(S.page, true); setStatus('저장됨'); if (okMsg) toast(okMsg); });
  }).catch(function(e){ setStatus(''); toast(e.message || '저장하지 못했어요.'); throw e; })
  .then(function(){ S.busy = false; }, function(){ S.busy = false; });
}
function setStatus(t){
  if (!$('status')) return;
  var base = t || (S.d && S.d.updated ? new Date(S.d.updated).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 기준' : '');
  var n = (S.d && S.d.pending) || 0;
  $('status').textContent = base + (n ? ' · 시트 저장 대기 '+n+'건' : '');
  $('status').className = 'status' + (n ? ' wait' : '');
}

/* ───── 시작 ───── */
function showLogin(msg){ S.timers.forEach(clearInterval); S.timers=[]; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('loginErr').textContent=msg||''; }
function logout(msg){
  S.token=null; S.d=null;
  try{ sessionStorage.clear(); localStorage.removeItem('g6_tok'); localStorage.removeItem('g6_keep'); }catch(e){}
  showLogin(msg);
}
$('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var b=$('loginBtn'); b.disabled=true; $('loginErr').textContent='';
  call('login',{ code: $('code').value }).then(function(d){
    S.token=d.token; try{ localStorage.setItem('g6_keep','1'); localStorage.setItem('g6_tok', d.token); }catch(e){}
    return start();
  }).catch(function(err){ $('loginErr').textContent = err.message||String(err); })
  .then(function(){ b.disabled=false; });
});
$('logoutBtn').addEventListener('click', function(){ logout('나왔어요.'); });
$('sheetBtn').addEventListener('click', function(){ if (S.d && S.d.sheetUrl) window.open(S.d.sheetUrl,'_blank','noopener'); });

function start(){
  var cached=null;
  try{ cached = JSON.parse(box().getItem('g6_data')||'null'); }catch(e){}
  if (cached) apply(cached);
  return call('data').then(function(d){ apply(d); try{ box().setItem('g6_data', JSON.stringify(d)); }catch(e){} })
    .catch(function(e){ if (!cached) throw e; });
}
function apply(d){
  S.d = d;
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('title').textContent = d.title || '6학년 운영 데스크';
  $('subtitle').textContent = d.year + '학년도 · ' + (d.grade||6) + '학년';
  $('logoutBtn').classList.toggle('hidden', !d.needCode);
  document.title = d.title || document.title;
  setStatus('');
  renderTabs(); go(S.page, true);
  if (!S.timers.length){
    S.timers.push(setInterval(function(){ if (S.page==='today') tickClock(); }, 1000));
    S.timers.push(setInterval(function(){ if (!document.hidden && !S.busy) refresh(); }, 120000));
  }
}
function refresh(){
  call('data').then(function(d){
    var changed = JSON.stringify(d)!==JSON.stringify(S.d);
    S.d=d; try{ box().setItem('g6_data', JSON.stringify(d)); }catch(e){}
    setStatus('');
    if (changed) go(S.page, true);
  }).catch(function(){});
}

/* ───── 책갈피 ───── */
var PAGES=[['today','오늘'],['cal','달력'],['check','수합'],['time','전담'],['week','주간계획'],['eval','평가'],
  ['stu','학생'],['memo','메모판'],['buy','준비물'],['rec','창체기록'],['data','자료']];
function renderTabs(){
  $('tabs').innerHTML = PAGES.map(function(p){
    var n = p[0]==='check' ? lateCount() : p[0]==='memo' ? (S.d.memos||[]).length : p[0]==='buy' ? (S.d.supplies||[]).filter(function(x){ return x.status!=='완료'; }).length : 0;
    return '<button type="button" data-k="'+p[0]+'" class="'+(S.page===p[0]?'on':'')+'">'+p[1]+(n?' <span class="n">'+n+'</span>':'')+'</button>';
  }).join('');
  each($('tabs').querySelectorAll('button'), function(b){ b.onclick=function(){ go(b.dataset.k); }; });
}
function go(page, quiet){
  S.page=page; if(!quiet) window.scrollTo(0,0);
  renderTabs();
  ({today:pToday,cal:pCal,check:pCheck,time:pTime,week:pWeek,eval:pEval,stu:pStu,memo:pMemo,buy:pBuy,rec:pRec,data:pData,search:pSearch})[page]();
  drawBanner();
}

/* ───── 계산 ───── */
function items(){ return (S.d.checklist && S.d.checklist.rows) || []; }
function missing(it){ return Object.keys(it.cls).filter(function(k){ return !it.cls[k]; }).sort(); }
function lateCount(){ return items().filter(function(it){ return it.due && it.due<today() && missing(it).length; }).length; }
function dueInfo(it){
  if (!missing(it).length) return { t:'완료', c:'ok' };
  if (!it.due) return { t:'마감 없음', c:'' };
  var n=dday(it.due);
  if (n<0) return { t:(-n)+'일 지남', c:'late' };
  if (n===0) return { t:'오늘까지', c:'late' };
  if (n<=3) return { t:'D-'+n, c:'soon' };
  return { t:'D-'+n, c:'' };
}
function nowInfo(){
  var now=new Date(), min=now.getHours()*60+now.getMinutes();
  var ps=(S.d.timetable&&S.d.timetable.periods)||[], cur=null, next=null;
  ps.forEach(function(p){ if(min>=p.s&&min<p.e) cur=p; if(!next&&min<p.s) next=p; });
  var day=now.getDay(), label;
  if (day===0||day===6) label='주말이에요';
  else if (cur) label=cur.name+' 진행 중';
  else if (ps.length&&min<ps[0].s) label='등교 전';
  else if (next) label='쉬는 시간 · 다음 '+next.name;
  else label='방과후';
  return { now:now, min:min, cur:cur, label:label, weekend:(day===0||day===6) };
}
function tickClock(){
  var el=$('clock'); if(!el) return;
  var n=nowInfo(), d=n.now;
  el.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if ($('nowState')) $('nowState').textContent=n.label;
}
function classesList(){
  var c=(S.d.classes||[]).map(String);
  if (c.length) return c.slice().sort();
  return Object.keys((S.d.timetable&&S.d.timetable.classes)||{}).sort();
}
function clsLabel(c){ return (S.d.grade||6)+'-'+c; }
/* 전담 배치 */
function spec(){ return S.d.specialist || { subjects:[], periods:[], days:{} }; }
function specDay(ds){ return (spec().days||{})[ds] || null; }
function specPeriods(){
  var pp=(spec().periods||[]).filter(function(p){ return /교시/.test(p.name); });
  if (pp.length) return pp;
  return periodsNum();
}
function specCount(ds){
  var d=specDay(ds); if(!d) return 0;
  var n=0; Object.keys(d.slots||{}).forEach(function(k){ n+=Object.keys(d.slots[k]).length; });
  return n;
}
function periodsNum(){ return ((S.d.timetable&&S.d.timetable.periods)||[]).filter(function(p){ return /^\d교시/.test(p.name); }); }
function weekRange(off){
  var n=new Date(); n.setHours(0,0,0,0);
  var mon=new Date(n); mon.setDate(n.getDate()-((n.getDay()+6)%7)+off*7);
  var sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return { mon:mon, sun:sun };
}
function eventsIn(a,b){ return (S.d.events||[]).filter(function(e){ return e.date>=ymd(a)&&e.date<=ymd(b); }).sort(function(x,y){ return x.date<y.date?-1:1; }); }

/* ───── 오늘 ───── */
function pToday(){
  var d=S.d, n=nowInfo(), t=today();
  var soon=items().filter(function(it){ return missing(it).length && (!it.due || dday(it.due)<=7); })
    .sort(function(a,b){ return (a.due||'9')<(b.due||'9')?-1:1; });
  var wk=weekRange(0), evs=eventsIn(wk.mon, wk.sun);
  var h='';
  h += '<div class="sheet"><div class="tape yellow"></div>'+
    '<div class="dayhead"><div class="big-day">'+n.now.getDate()+'</div>'+
    '<div class="dow-box"><div class="dow">'+WD[n.now.getDay()]+'요일</div><div class="md">'+n.now.getFullYear()+'. '+(n.now.getMonth()+1)+'.</div></div>'+
    '<div class="nowbox"><div class="state" id="nowState">'+esc(n.label)+'</div><div class="clock" id="clock">--:--</div></div></div>'+
    '<div class="stats">'+
      '<div class="stat"><small>수합 항목</small><b>'+items().length+'</b></div>'+
      '<div class="stat '+(lateCount()?'warn':'')+'"><small>마감 지남·미제출</small><b>'+lateCount()+'</b></div>'+
      '<div class="stat"><small>이번 주 일정</small><b>'+evs.length+'</b></div>'+
      '<div class="stat"><small>오늘 전담</small><b>'+specCount(specDay(t)?t:nextSchoolDay())+'</b></div>'+
    '</div></div>';

  var sd = specDay(t) ? t : nextSchoolDay();
  h += '<div class="sheet"><h3 class="title"><span class="mark">'+(sd===t?'오늘 전담':'다음 등교일 전담')+'</span>'+
    '<span class="more">'+md(sd)+' · 빈칸은 담임 수업</span></h3>'+ ttTable(sd, true) +'</div>';

  h += '<div class="grid2">';
  h += '<div class="sheet"><h3 class="title"><span class="mark">곧 마감</span><span class="more">'+soon.length+'건</span></h3>'+
    (soon.length ? soon.slice(0,6).map(itemRow).join('') : '<div class="empty">급한 수합이 없어요.</div>')+
    '<div style="margin-top:10px"><button type="button" class="btn line sm" data-go="check">수합 전체 보기</button></div></div>';

  h += '<div class="sheet"><h3 class="title"><span class="mark">이번 주 일정</span></h3>'+
    (evs.length ? evs.map(evRow).join('') : '<div class="empty">아래에 적으면 학년 일정으로 모여요.</div>')+
    '<div class="formrow"><div class="f" style="max-width:150px"><label>날짜</label><input id="evDate" type="date" value="'+t+'"></div>'+
      '<div class="f"><label>내용</label><input id="evText" placeholder="예) 6학년 현장체험학습 사전답사"></div>'+
      '<button type="button" class="btn sm" id="evAdd">＋ 적기</button></div>'+
    '<div class="chips" style="margin-top:12px">'+
      '<button type="button" class="chip blue" data-copy="week0">이번 주 공지 복사</button>'+
      '<button type="button" class="chip blue" data-copy="week1">다음 주 공지 복사</button>'+
    '</div></div>';
  h += '</div>';

  var memos=(d.memos||[]).slice(0,4);
  if (memos.length){
    h += '<div class="sheet plain"><h3 class="title"><span class="mark">메모판</span><span class="more">최근 '+memos.length+'장</span></h3>'+
      '<div class="notes">'+memos.map(noteCard).join('')+'</div>'+
      '<div style="margin-top:12px"><button type="button" class="btn line sm" data-go="memo">메모판 열기</button></div></div>';
  }
  if ((d.links||[]).length){
    h += '<div class="sheet plain"><h3 class="title"><span class="mark">자주 쓰는 링크</span></h3><div class="links">'+
      d.links.slice(0,20).map(function(l){ return /^https?:/i.test(l.url)?'<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>':''; }).join('')+'</div></div>';
  }
  $('view').innerHTML=h;
  wire(); tickClock();
  if ($('evAdd')) $('evAdd').onclick=addEvent;
}
function ttTable(ds, markNow){
  var cls=classesList(), pp=specPeriods(), day=specDay(ds);
  if (!pp.length) return '<div class="empty">시간표 탭을 읽지 못했어요.</div>';
  if (!day) return '<div class="empty">'+md(ds)+'은 전담 배치표에 없는 날이에요.</div>';
  var n=nowInfo(), isToday = ds===today();
  var h='<table class="tt spec"><thead><tr><th class="pcol">'+md(ds)+'</th>'+
    cls.map(function(c){ return '<th>'+esc(clsLabel(c))+'</th>'; }).join('')+'</tr></thead><tbody>';
  var any=false;
  pp.forEach(function(p){
    var row=(day.slots||{})[p.name]||{};
    var isNow = markNow && isToday && n.cur && n.cur.name===p.name;
    h+='<tr class="'+(isNow?'nowrow':'')+'"><td class="pcol"><b>'+esc(p.name)+'</b><br>'+hm(p.s)+'–'+hm(p.e)+'</td>';
    cls.forEach(function(c){
      var v=row[c]||'';
      if (v) any=true;
      h+='<td>'+(v?'<span class="sj sj-'+esc(String(v).replace(/\(.*\)/,''))+'">'+esc(v)+'</span>'
                : '<span class="homeroom">담임</span>')+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  if (!any) h+='<div class="empty small">이 날은 전담 수업이 없어요.</div>';
  if ((day.notes||[]).length) h+='<div class="daynotes">'+day.notes.map(function(t){ return '<span class="note-line">'+esc(t)+'</span>'; }).join('')+'</div>';
  var free=allFree(ds);
  if (free.length) h+='<div class="freerow">4개 반 모두 전담 · <b>'+free.join(', ')+'</b> — 학년 협의 가능</div>';
  return h;
}
/* 네 반이 동시에 전담인 교시 */
function allFree(ds){
  var day=specDay(ds); if(!day) return [];
  var cls=classesList(), out=[];
  specPeriods().forEach(function(p){
    var row=(day.slots||{})[p.name]||{};
    if (cls.length && cls.every(function(c){ return row[c]; })) out.push(p.name);
  });
  return out;
}
function wdOf(ds){ var d=new Date(ds+'T00:00:00'); return WD[d.getDay()]; }
function nextSchoolDay(){
  var d=new Date(); d.setHours(0,0,0,0);
  for (var i=0;i<14;i++){ var k=ymd(d); if (specDay(k)) return k; d.setDate(d.getDate()+1); }
  return today();
}
function evRow(e){
  return '<div class="ev"><span class="when">'+md(e.date)+'</span><span><span class="dot"></span>'+esc(e.text)+
    (e.pending?' <span class="saving">저장 중</span>':'')+'</span>'+

/* ───── 수합 ───── */
function pCheck(){
  var list=items(), f=S.filter;
  var g={ todo:list.filter(function(i){ return missing(i).length; }),
    late:list.filter(function(i){ return i.due && i.due<today() && missing(i).length; }),

    '<div class="formrow"><div class="f"><label>항목 이름</label><input id="niName" placeholder="예) 현장체험학습 신청서"></div>'+
    '<div class="f" style="max-width:160px"><label>마감일</label><input id="niDue" type="date"></div>'+

  $('view').innerHTML=h;

  $('niAdd').onclick=function(){

function itemRow(it){

/* ───── 시간표 ───── */
function pTime(){
  var n=nowInfo(), sp=spec();
  if (!S.specDate || !specDay(S.specDate)) S.specDate = specDay(today()) ? today() : nextSchoolDay();
  var wk=weekRangeOf(S.specDate), days=[];
  for (var i=0;i<5;i++){ var d=new Date(wk.mon); d.setDate(wk.mon.getDate()+i); days.push(ymd(d)); }

  var h='<div class="sheet"><div class="tape"></div><h3 class="title"><span class="mark">전담 배치</span>'+
    '<span class="more">'+esc(sp.tab||'')+(sp.from?' · '+md(sp.from)+' ~ '+md(sp.to):'')+'</span></h3>'+
    '<div class="chips">'+
      '<button type="button" class="chip" data-spw="-1">◀ 지난주</button>'+
      '<button type="button" class="chip" data-spstep="-1">◀ 하루</button>'+
      days.map(function(d){
        var on = d===S.specDate, has = !!specDay(d);
        return '<button type="button" class="chip '+(on?'on':'')+(has?'':' off')+'" data-spd="'+d+'">'+
          md(d)+(d===today()?' ·오늘':'')+'</button>';
      }).join('')+
      '<button type="button" class="chip" data-spstep="1">하루 ▶</button>'+
      '<button type="button" class="chip" data-spw="1">다음 주 ▶</button>'+
    '</div><div style="margin-top:14px">'+ttTable(S.specDate, true)+'</div>'+
    '<div class="chips" style="margin-top:12px"><button type="button" class="chip blue" data-go="cal">달력에서 날짜 고르기</button></div></div>';

  // 이번 주 한눈에
  h+='<div class="sheet"><h3 class="title"><span class="mark">이번 주 전담</span>'+
    '<span class="more">'+md(days[0])+' ~ '+md(days[4])+'</span></h3>'+weekSpecTable(days)+'</div>';

  // 반별 주당 전담 시수
  var cls=classesList(), cnt={}, bySub={};
  days.forEach(function(d){
    var day=specDay(d); if(!day) return;
    Object.keys(day.slots||{}).forEach(function(pn){
      Object.keys(day.slots[pn]).forEach(function(c){
        cnt[c]=(cnt[c]||0)+1;
        var sj=day.slots[pn][c]; bySub[sj]=(bySub[sj]||0)+1;
      });
    });
  });
  h+='<div class="grid2">';
  h+='<div class="sheet plain"><h3 class="title"><span class="mark">반별 주당 전담</span></h3><div class="chips">'+
    cls.map(function(c){ return '<span class="chip">'+esc(clsLabel(c))+' '+(cnt[c]||0)+'시간</span>'; }).join('')+'</div></div>';
  h+='<div class="sheet plain"><h3 class="title"><span class="mark">과목별</span><span class="more">4개 반 합계</span></h3><div class="chips">'+
    (Object.keys(bySub).length ? Object.keys(bySub).sort(function(a,b){ return bySub[b]-bySub[a]; })
      .map(function(k){ return '<span class="chip">'+esc(k)+' '+bySub[k]+'</span>'; }).join('')
      : '<span class="empty small">이번 주 전담이 없어요.</span>')+'</div></div>';
  h+='</div>';

  var pp=specPeriods();
  h+='<div class="sheet plain"><h3 class="title"><span class="mark">수업 시정</span></h3>'+
    (pp.length?'<table class="list"><tbody>'+pp.map(function(p){
      return '<tr'+(n.cur===p?' style="background:rgba(255,223,80,.25)"':'')+'><td>'+esc(p.name)+'</td><td class="num">'+hm(p.s)+' – '+hm(p.e)+'</td></tr>';
    }).join('')+'</tbody></table>':'<div class="empty">시정을 읽지 못했어요.</div>')+'</div>';

  $('view').innerHTML=h;
  each($('view').querySelectorAll('[data-spd]'), function(b){ b.onclick=function(){ S.specDate=b.dataset.spd; pTime(); }; });
  each($('view').querySelectorAll('[data-spstep]'), function(b){ b.onclick=function(){
    var step=Number(b.dataset.spstep), d=new Date(S.specDate+'T00:00:00');
    for (var i=0;i<14;i++){ d.setDate(d.getDate()+step); if (specDay(ymd(d))) break; }
    S.specDate=ymd(d); pTime(); }; });
  each($('view').querySelectorAll('[data-spw]'), function(b){ b.onclick=function(){
    var d=new Date(S.specDate+'T00:00:00'); d.setDate(d.getDate()+7*Number(b.dataset.spw));
    S.specDate=ymd(d); pTime(); }; });
  wire();
}
/* 교시 × 요일 한 판 */
function weekSpecTable(days){
  var pp=specPeriods(), cls=classesList();
  if (!pp.length) return '<div class="empty">시정을 읽지 못했어요.</div>';
  var h='<table class="tt week"><thead><tr><th class="pcol">교시</th>'+
    days.map(function(d){ var dd=new Date(d+'T00:00:00'); return '<th'+(d===today()?' class="td-today"':'')+'>'+WD[dd.getDay()]+'<br><span class="small muted">'+(dd.getMonth()+1)+'/'+dd.getDate()+'</span></th>'; }).join('')+
    '</tr></thead><tbody>';
  pp.forEach(function(p){
    h+='<tr><td class="pcol"><b>'+esc(p.name)+'</b><br>'+hm(p.s)+'–'+hm(p.e)+'</td>';
    days.forEach(function(d){
      var day=specDay(d), row=(day&&day.slots||{})[p.name]||{};
      var keys=Object.keys(row).sort();
      h+='<td'+(d===today()?' class="td-today"':'')+'>'+
        (keys.length? keys.map(function(c){ return '<span class="sj sj-'+esc(String(row[c]).replace(/\(.*\)/,''))+'">'+c+'반 '+esc(row[c])+'</span>'; }).join(' ')
                    : (day?'':'<span class="small muted">–</span>'))+'</td>';
    });
    h+='</tr>';
  });
  return h+'</tbody></table>';
}
function weekRangeOf(ds){
  var n=new Date(ds+'T00:00:00');
  var mon=new Date(n); mon.setDate(n.getDate()-((n.getDay()+6)%7));
  var sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return { mon:mon, sun:sun };
}


/* ───── 달력 ───── */
function monthOf(ds){ return ds.slice(0,7); }
function eventsOn(ds){ return (S.d.events||[]).filter(function(e){ return e.date===ds; }); }
function duesOn(ds){ return items().filter(function(it){ return it.due===ds; }); }

function pCal(){
  if (!S.calMonth) S.calMonth = monthOf(today());
  if (!S.calPick) S.calPick = today();
  var y=Number(S.calMonth.slice(0,4)), m=Number(S.calMonth.slice(5,7));
  var first=new Date(y, m-1, 1), last=new Date(y, m, 0);
  var lead=first.getDay();                       // 일요일 시작
  var cells=[];
  for (var i=0;i<lead;i++) cells.push(null);
  for (var d=1; d<=last.getDate(); d++) cells.push(ymd(new Date(y, m-1, d)));
  while (cells.length % 7) cells.push(null);

  var h='<div class="sheet"><div class="tape pink"></div>'+
    '<h3 class="title"><span class="mark">'+y+'년 '+m+'월</span>'+
    '<span class="more"><span class="chips">'+
      '<button type="button" class="chip" data-cm="-1">◀ 지난달</button>'+
      '<button type="button" class="chip" data-cm="0">이번 달</button>'+
      '<button type="button" class="chip" data-cm="1">다음 달 ▶</button>'+
    '</span></span></h3>'+
    '<table class="cal"><thead><tr>'+['일','월','화','수','목','금','토'].map(function(w,i){
      return '<th class="'+(i===0?'sun':i===6?'sat':'')+'">'+w+'</th>'; }).join('')+'</tr></thead><tbody>';

  for (var r=0; r<cells.length/7; r++){
    h+='<tr>';
    for (var c=0; c<7; c++){
      var ds=cells[r*7+c];
      if (!ds){ h+='<td class="blank"></td>'; continue; }
      var evs=eventsOn(ds), dues=duesOn(ds), sp=specCount(ds);
      var cl=[]; 
      if (ds===today()) cl.push('is-today');
      if (ds===S.calPick) cl.push('is-pick');
      if (c===0) cl.push('sun'); if (c===6) cl.push('sat');
      if (evs.some(function(e){ return e.important; })) cl.push('has-star');
      h+='<td class="'+cl.join(' ')+'" data-cal="'+ds+'"><div class="dnum">'+Number(ds.slice(8))+'</div>'+
        evs.slice(0,3).map(function(e){
          return '<div class="cev'+(e.important?' star':'')+(e.pending?' pend':'')+'">'+(e.important?'★ ':'')+esc(e.text)+'</div>'; }).join('')+
        (evs.length>3?'<div class="cmore">＋'+(evs.length-3)+'</div>':'')+
        dues.slice(0,2).map(function(x){ return '<div class="cdue">마감 '+esc(x.name.replace(/\s*\([^)]*까지\)\s*/,''))+'</div>'; }).join('')+
        (sp?'<div class="cspec">전담 '+sp+'</div>':'')+
      '</td>';
    }
    h+='</tr>';
  }
  h+='</tbody></table></div>';

  // 고른 날
  var pd=S.calPick, pev=eventsOn(pd), pdue=duesOn(pd);
  h+='<div class="grid2">';
  h+='<div class="sheet"><h3 class="title"><span class="mark">'+md(pd)+'</span>'+
    '<span class="more">날짜를 누르면 바뀌어요</span></h3>'+
    (pev.length? pev.map(evRow).join('') : '<div class="empty">적힌 일정이 없어요.</div>')+
    (pdue.length? '<hr class="rule">'+pdue.map(function(x){
        return '<div class="ev"><span class="when">수합</span><span>'+esc(x.name)+' 마감</span></div>'; }).join('') : '')+
    '<hr class="rule">'+
    '<div class="formrow"><div class="f"><label>새 일정</label><input id="calText" placeholder="예) 학년 협의회 15:00 (6-1 교실)"></div>'+
      '<button type="button" class="btn sm" id="calAdd">＋ 적기</button></div>'+
    '<div class="chips" style="margin-top:8px">'+
      '<button type="button" class="chip star-toggle" id="calStar">★ 중요 일정으로</button>'+
      '<span class="small muted" style="align-self:center">중요로 적으면 그 주 내내 맨 위 띠에 보여요</span>'+
    '</div></div>';

  h+='<div class="sheet"><h3 class="title"><span class="mark">'+md(pd)+' 전담</span>'+
    '<span class="more"><button type="button" class="chip" data-gospec="'+pd+'">전담 화면에서 보기</button></span></h3>'+
    ttTable(pd, true)+'</div>';
  h+='</div>';

  $('view').innerHTML=h;

  each($('view').querySelectorAll('[data-cm]'), function(b){ b.onclick=function(){
    var n=Number(b.dataset.cm);
    if (!n) S.calMonth=monthOf(today());
    else { var d=new Date(Number(S.calMonth.slice(0,4)), Number(S.calMonth.slice(5,7))-1+n, 1);
           S.calMonth=ymd(d).slice(0,7); }
    pCal(); }; });
  each($('view').querySelectorAll('[data-cal]'), function(td){ td.onclick=function(){ S.calPick=td.dataset.cal; pCal(); }; });
  each($('view').querySelectorAll('[data-gospec]'), function(b){ b.onclick=function(e){
    e.stopPropagation(); S.specDate=b.dataset.gospec; go('time'); }; });

  var star=false;
  $('calStar').onclick=function(){ star=!star; $('calStar').classList.toggle('on', star); };
  $('calAdd').onclick=function(){
    var text=$('calText').value.trim();
    if (!text) return toast('내용을 적어 주세요.');
    if (!needName()) return;
    act('addEvent', { date:S.calPick, text:text, important:star }, '달력에 적었어요.');
  };
  $('calText').addEventListener('keydown', function(e){ if(e.key==='Enter') $('calAdd').click(); });
  wire();
}

  var cur=ev.filter(function(x){ return x.subject===S.subject; })[0];
  var byMonth={};
  ev.forEach(function(s){ s.rows.forEach(function(r){ var m=(String(r.when).match(/(\d{1,2})\s*월/)||[])[1]; if(m)(byMonth[m]=byMonth[m]||[]).push(s.subject); }); });

    Object.keys(byMonth).sort(function(a,b){ return a-b; }).map(function(m){
      var n=byMonth[m].length;
      return '<span class="chip '+(n>=6?'red on':'')+'">'+m+'월 '+n+'개'+(n>=6?' 몰림':'')+'</span>';
    }).join('')+'</div><div class="small muted" style="margin-top:8px">한 달에 6개가 넘으면 평가가 몰린 달이에요.</div></div>';
  h+='<div class="sheet"><h3 class="title"><span class="mark">평가계획</span><span class="more"><span class="chips">'+
    ev.map(function(x){ return '<button type="button" class="chip '+(S.subject===x.subject?'on':'')+'" data-sub="'+esc(x.subject)+'">'+esc(x.subject)+'</button>'; }).join('')+'</span></span></h3>'+
    (cur? cur.rows.map(function(r){
      return '<div class="eval"><b>'+esc(r.when)+' · '+esc(r.unit)+'</b><div>'+esc(r.what)+'</div>'+
        '<div class="small muted">'+esc([r.area,r.how].filter(String).join(' · '))+'</div></div>';

/* ───── 검색 ───── */
function pSearch(){
  var q=(S.q||'').trim(), ql=q.toLowerCase(), hits=[];
  if (q){
    items().forEach(function(it){ if (it.name.toLowerCase().indexOf(ql)>=0)
      hits.push({ g:'수합', t:it.name, s:(missing(it).length?'미제출 '+missing(it).join(',')+'반':'완료'), go:'check' }); });
    (S.d.students||[]).forEach(function(s){ if (s.name.indexOf(q)>=0)
      hits.push({ g:'학생', t:s.name, s:s.cls+(s.no?' · '+s.no+'번':''), go:'stu' }); });
    (S.d.events||[]).forEach(function(e){ if (e.text.toLowerCase().indexOf(ql)>=0)
      hits.push({ g:'일정', t:e.text, s:md(e.date), go:'today' }); });
    (S.d.memos||[]).forEach(function(m){ if (m.text.toLowerCase().indexOf(ql)>=0)
      hits.push({ g:'메모', t:m.text.slice(0,60), s:m.who||'', go:'memo' }); });
    (S.d.supplies||[]).forEach(function(x){ if ((x.name+' '+x.use).toLowerCase().indexOf(ql)>=0)
      hits.push({ g:'준비물', t:x.name, s:(x.status||'요청')+(x.use?' · '+x.use:''), go:'buy' }); });
    (S.d.evaluation||[]).forEach(function(sj){ sj.rows.forEach(function(r){
      if ([r.when,r.unit,r.what,r.how].join(' ').toLowerCase().indexOf(ql)>=0)
        hits.push({ g:'평가 · '+sj.subject, t:r.unit||r.what, s:r.when+' · '+r.what, go:'eval', subject:sj.subject });
    }); });
    Object.keys(S.d.raw||{}).forEach(function(tab){ (S.d.raw[tab]||[]).forEach(function(r){
      var line=r[1].join(' | ');
      if (line.toLowerCase().indexOf(ql)>=0 && hits.length<120) hits.push({ g:'자료 · '+tab, t:line.slice(0,80), s:r[0]+'행', go:'data', tab:tab, row:r[0] });
    }); });
  }
  $('view').innerHTML='<div class="sheet"><h3 class="title"><span class="mark">“'+esc(q)+'” 찾기</span><span class="more">'+hits.length+'건</span></h3>'+
    (hits.length? hits.slice(0,80).map(function(x,i){
      return '<div class="ev" data-i="'+i+'" style="cursor:pointer"><span class="when">'+esc(x.g)+'</span><span><b>'+esc(x.t)+'</b> <span class="small muted">'+esc(x.s)+'</span></span></div>';
    }).join('') : '<div class="empty">찾는 내용이 없어요.</div>')+'</div>';
  each($('view').querySelectorAll('.ev[data-i]'), function(el){
    el.onclick=function(){
      var x=hits[+el.dataset.i];
      if (x.subject) S.subject=x.subject;
      if (x.tab) S.tab=x.tab;
      go(x.go);
      if (x.row) setTimeout(function(){ var tr=document.querySelector('table.sheetview tr[data-r="'+x.row+'"]'); if (tr){ tr.classList.add('hit'); tr.scrollIntoView({block:'center'}); } },80);
    };
  });
}

/* ───── 복사 도구 ───── */
function copyWeek(off){
  var r=weekRange(off), evs=eventsIn(r.mon,r.sun);
  var due=items().filter(function(it){ return it.due && it.due>=ymd(r.mon) && it.due<=ymd(r.sun); });
  var out=['['+(S.d.grade||6)+'학년 '+(off?'다음 주':'이번 주')+'] '+md(ymd(r.mon))+' ~ '+md(ymd(r.sun)),''];
  if (evs.length){ out.push('■ 일정'); evs.forEach(function(e){ out.push(' · '+md(e.date)+' '+e.text); }); out.push(''); }
  if (due.length){ out.push('■ 수합 마감');
    due.forEach(function(it){ var m=missing(it); out.push(' · '+md(it.due)+' '+it.name.replace(/\s*\([^)]*까지\)\s*/,'')+(m.length?' (미제출: '+m.join(',')+'반)':' (완료)')); }); out.push(''); }
  if (!evs.length && !due.length) out.push('등록된 일정·수합이 없습니다.');
  copyText(out.join('\n').trim()).then(function(){ toast('공지 문구를 복사했어요.'); });
}
function copyRemind(){
  var late=items().filter(function(it){ return missing(it).length; });
  if (!late.length) return toast('미제출이 없어요 😀');
  var by={1:[],2:[],3:[],4:[]};
  late.forEach(function(it){ missing(it).forEach(function(k){ by[k].push(it.name.replace(/\s*\([^)]*까지\)\s*/,'')+(it.due?'('+md(it.due)+')':'')); }); });
  var out=['['+(S.d.grade||6)+'학년 수합 안내] '+md(today()),''];
  ['1','2','3','4'].forEach(function(k){ if (by[k].length) out.push(k+'반: '+by[k].join(' / ')); });
  out.push('','확인 후 제출 부탁드립니다 🙏');
  copyText(out.join('\n')).then(function(){ toast('독촉 문구를 복사했어요.'); });
}
function copyRoster(){
  var stu=S.d.students||[], by={};
  stu.forEach(function(s){ (by[s.cls]=by[s.cls]||[]).push((s.no?s.no+'. ':'')+s.name); });
  var out=[];
  Object.keys(by).sort().forEach(function(c){ out.push('['+c+'] '+by[c].length+'명'); out.push(by[c].join(', ')); out.push(''); });
  copyText(out.join('\n').trim()).then(function(){ toast('명렬을 복사했어요.'); });
}
function copyRec(){
  if (!S.recRows || !S.recRows.length) return toast('먼저 배분해 주세요.');
  var out=['['+S.recEvent+'] '+(S.cls||'')+' 창체 누가기록',''];
  S.recRows.forEach(function(r){ out.push((r.no?r.no+'. ':'')+r.name+' — '+r.text); });
  copyText(out.join('\n')).then(function(){ toast('배분 결과를 복사했어요.'); });
}
function downloadIcs(){
  var r=weekRange(S.weekOff), evs=eventsIn(r.mon,r.sun);
  if (!evs.length) return toast('내보낼 일정이 없어요.');
  function e(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
  function dd(s){ return s.replace(/-/g,''); }
  function nx(s){ var d=parseYmd(s); d.setDate(d.getDate()+1); return dd(ymd(d)); }
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//grade6-desk//KO','X-WR-CALNAME:'+e((S.d.grade||6)+'학년 일정')];
  evs.forEach(function(x,i){
    L.push('BEGIN:VEVENT','UID:g6-'+dd(x.date)+'-'+i+'@desk','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+dd(x.date),
      'DTEND;VALUE=DATE:'+nx(x.date),'SUMMARY:'+e(x.text),'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'}));
  a.download='6학년_일정.ics'; document.body.appendChild(a); a.click(); a.remove();
  toast('캘린더 파일을 받았어요.');
}

/* ───── 공통 이벤트 ───── */
function wire(){

      else if (k==='remind') copyRemind(); else if (k==='roster') copyRoster();
      else if (k==='rec') copyRec(); else if (k==='ics') downloadIcs();
    };
  });
  each($('view').querySelectorAll('[data-go]'), function(b){ b.onclick=function(){ go(b.dataset.go); }; });
  each($('view').querySelectorAll('.cls[data-row]'), function(b){
    b.onclick=function(){
      if (!needName()) return;
      b.classList.add('busy');

    };
  });
  each($('view').querySelectorAll('[data-delmemo]'), function(b){
    b.onclick=function(){ if (confirm('이 메모를 뗄까요?')) act('delRow', { tab:'memo', row:+b.dataset.delmemo }, '메모를 뗐어요.'); };

  each($('view').querySelectorAll('[data-delev]'), function(b){
    b.onclick=function(){ if (confirm('이 일정을 지울까요?')) act('delRow', { tab:'event', row:+b.dataset.delev }, '일정을 지웠어요.'); };
